<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>工作日历</title>
<script src="assets/tailwind.min.js"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link rel="stylesheet" href="assets/theme_wenku8.css">
<style type="text/tailwindcss">
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; }
  .card { @apply bg-white dark:bg-slate-800/80 rounded-2xl border border-slate-200/70 dark:border-slate-700/70 shadow-[0_1px_3px_rgba(15,23,42,0.04)]; }
  .badge { @apply inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap; }
  .btn { @apply inline-flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition-all duration-200 select-none active:scale-[0.97]; }
  .btn-primary { @apply bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-md shadow-indigo-500/25 active:brightness-110; }
  .btn-ghost { @apply bg-slate-100 text-slate-700 dark:bg-slate-700/60 dark:text-slate-200; }
  .btn-danger { @apply bg-rose-50 text-rose-600 dark:bg-rose-900/25 dark:text-rose-300; }
  .input { @apply w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400/60 focus:border-indigo-400 transition-shadow; }
  .label { @apply block text-xs text-slate-500 dark:text-slate-400 mb-1.5 font-medium; }
  .muted { @apply text-slate-400 dark:text-slate-400 text-xs; }
  .chip { @apply px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap cursor-pointer select-none border transition-all; }
  .chip-on { @apply bg-gradient-to-r from-indigo-500 to-violet-500 text-white border-transparent shadow-md shadow-indigo-500/25; }
  .chip-off { @apply bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-600; }
  .tabbar-item { @apply flex-1 flex flex-col items-center justify-center gap-0.5 py-1.5 text-[10px] text-slate-400 dark:text-slate-500 cursor-pointer select-none transition-colors; }
  .tabbar-item.active { @apply text-indigo-600 dark:text-indigo-400 font-medium; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  ::selection { background: rgba(99, 102, 241, 0.18); }
  * { -webkit-tap-highlight-color: transparent; }
  .stat-num, .countdown, .tabular { font-variant-numeric: tabular-nums; }
  @keyframes pageIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .page-in { animation: pageIn 0.26s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { animation: fadeUp 0.3s ease both; }
  @keyframes toastIn { from { transform: translateY(12px) scale(0.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .toast-in { animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
  /* ---------- 布局防御：防横向溢出 / 长文换行 / 图片收缩（2026-10-16） ---------- */
  html, body { overflow-x: hidden; max-width: 100vw; }
  #mainArea, #detailBody, #formBody, #awardDetailPage, .card { overflow-wrap: break-word; min-width: 0; }
  img { max-width: 100%; }
  pre, code { white-space: pre-wrap; overflow-wrap: anywhere; }

  /* ---------- 图片全屏查看器 ---------- */
  #wcImageViewer { position: fixed; inset: 0; z-index: 2147483000; background: rgba(8, 10, 16, .96);
    display: flex; align-items: center; justify-content: center; touch-action: none; }
  #wcImageViewer img { position: absolute; max-width: 100%; max-height: 100%; will-change: transform;
    transform-origin: 0 0; transition: transform .18s ease; }
  #wcImageViewer img.wcDragging { transition: none; }
  #wcImageViewer .wciv-close { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px;
    width: 38px; height: 38px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 17px; z-index: 2; }
  #wcImageViewer .wciv-hint { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
    text-align: center; color: rgba(255,255,255,.55); font-size: 11px; z-index: 2; pointer-events: none; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100" style="height:100dvh; display:flex; flex-direction:column; overflow:hidden;">

<!-- 顶栏（紧凑） -->
<header class="shrink-0 flex items-center gap-2 px-4 pt-[calc(10px+env(safe-area-inset-top,0px))] pb-2.5 bg-white/85 dark:bg-slate-800/85 backdrop-blur-lg border-b border-slate-200/60 dark:border-slate-700/60 z-30">
  <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-md shadow-indigo-500/30 shrink-0" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4.5 h-4.5 text-white" style="width:18px;height:18px"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/><path d="m9 14.5 2 2 4-4"/></svg>
  </div>
  <div class="text-[15px] font-bold bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">工作日历</div>
  <div class="flex-1"></div>
  <button id="themeBtn" class="btn btn-ghost !py-2 !px-3" onclick="toggleTheme()" aria-label="切换深色/浅色模式">
    <svg id="themeMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5Z"/></svg>
    <svg id="themeSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px" class="hidden" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="7" y2="7"/><line x1="17" y1="17" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="7" y2="17"/><line x1="17" y1="7" x2="18.8" y2="5.2"/></svg>
  </button>
</header>

<!-- 主区：5 个标签页 -->
<main class="flex-1 overflow-y-auto overscroll-contain px-3.5 pt-3" id="mainArea" style="padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))">
  <div id="view-home" class="view hidden"></div>
  <div id="view-comps" class="view hidden"></div>
  <div id="view-awards" class="view hidden"></div>
  <div id="view-ai" class="view hidden"></div>
  <div id="view-settings" class="view hidden"></div>
</main>

<!-- 底部标签栏 -->
<nav class="shrink-0 flex items-stretch px-1 pb-[env(safe-area-inset-bottom,0px)] bg-white/95 dark:bg-slate-800/95 backdrop-blur-lg border-t border-slate-200/60 dark:border-slate-700/60 z-40">
  <div class="tabbar-item active" data-view="home" onclick="go('home')" role="button" tabindex="0" aria-label="总览">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    总览</div>
  <div class="tabbar-item" data-view="comps" onclick="go('comps')" role="button" tabindex="0" aria-label="比赛">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
    比赛</div>
  <div class="tabbar-item" data-view="awards" onclick="go('awards')" role="button" tabindex="0" aria-label="获奖">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 5.5H5a3 3 0 0 0 3 4"/><path d="M16 5.5h3a3 3 0 0 1-3 4"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="7" y1="20" x2="17" y2="20"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
    获奖</div>
  <div class="tabbar-item" data-view="ai" onclick="go('ai')" role="button" tabindex="0" aria-label="AI 助手">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><circle cx="9" cy="13.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.5" r="1" fill="currentColor" stroke="none"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1" fill="currentColor" stroke="none"/></svg>
    AI</div>
  <div class="tabbar-item" data-view="settings" onclick="go('settings')" role="button" tabindex="0" aria-label="设置">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:21px;height:21px" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg>
    设置</div>
</nav>

<!-- 全屏页：比赛详情 -->
<div id="detailPage" class="fixed inset-0 z-50 hidden bg-slate-50 dark:bg-slate-900 overflow-y-auto">
  <div id="detailBody"></div>
</div>

<!-- 全屏页：比赛表单 -->
<div id="formPage" class="fixed inset-0 z-50 hidden bg-slate-50 dark:bg-slate-900 overflow-y-auto">
  <div class="sticky top-0 flex items-center gap-3 px-4 py-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200/60 dark:border-slate-700/60" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
    <button class="btn btn-ghost !py-1.5 !px-3 text-xs" onclick="closeForm()">取消</button>
    <h3 id="formTitle" class="font-bold flex-1 text-center">添加比赛</h3>
    <button class="btn btn-primary !py-1.5 !px-4 text-xs" onclick="submitForm()">保存</button>
  </div>
  <div id="formBody" class="p-4" style="padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))"></div>
  <div class="fixed left-0 right-0 bottom-0 z-10 p-3.5 pb-[calc(14px + env(safe-area-inset-bottom,0px))] bg-gradient-to-t from-slate-50 dark:from-slate-900 via-slate-50/95 dark:via-slate-900/95 to-transparent">
    <button class="btn btn-primary w-full !py-3" onclick="submitForm()">💾 保存比赛</button>
  </div>
</div>

<!-- 全屏页：获奖详情 -->
<div id="awardDetailPage" class="fixed inset-0 z-50 hidden bg-slate-50 dark:bg-slate-900 overflow-y-auto">
  <div id="awardDetailBody"></div>
</div>

<!-- 全屏页：获奖表单 -->
<div id="awardFormPage" class="fixed inset-0 z-50 hidden bg-slate-50 dark:bg-slate-900 overflow-y-auto">
  <div class="sticky top-0 flex items-center gap-3 px-4 py-3 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200/60 dark:border-slate-700/60" style="padding-top:calc(12px + env(safe-area-inset-top,0px))">
    <button class="btn btn-ghost !py-1.5 !px-3 text-xs" onclick="closeAwardForm()">取消</button>
    <h3 id="awardFormTitle" class="font-bold flex-1 text-center">添加获奖</h3>
    <button class="btn btn-primary !py-1.5 !px-4 text-xs" onclick="submitAwardForm()">保存</button>
  </div>
  <div id="awardFormBody" class="p-4" style="padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))"></div>
  <div class="fixed left-0 right-0 bottom-0 z-10 p-3.5 pb-[calc(14px + env(safe-area-inset-bottom,0px))] bg-gradient-to-t from-slate-50 dark:from-slate-900 via-slate-50/95 dark:via-slate-900/95 to-transparent">
    <button class="btn btn-primary w-full !py-3" onclick="submitAwardForm()">💾 保存获奖</button>
  </div>
</div>

<!-- 悬浮添加按钮 -->
<button id="fab" class="fixed right-4 z-40 w-14 h-14 rounded-full bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-xl shadow-indigo-500/40 flex items-center justify-center active:scale-95 transition-transform hidden" style="bottom:calc(88px + env(safe-area-inset-bottom,0px))" onclick="fabAction()" aria-label="添加">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="width:26px;height:26px" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div id="toast" class="fixed left-3 right-3 z-[60] space-y-2" style="bottom:calc(80px + env(safe-area-inset-bottom,0px))"></div>

<script src="assets/echarts.min.js"></script>
<script src="assets/qrcode.min.js"></script>
<script src="assets/jsqr.min.js"></script>
<script src="./core.js"></script>
<script src="./ai_files.js"></script>
<script src="./assets/xlsx.full.min.js"></script>
<script src="./ai_mobile.js"></script>
<script>
/* ================= 视图层（移动版）：逻辑全部来自 core.js ================= */

let refreshTimer = null;
let _lastDataSnap = '';
async function refresh() {
  const q = new URLSearchParams();
  if (S.filter.keyword) q.set('keyword', S.filter.keyword);
  if (S.filter.cats.length) S.filter.cats.forEach(c => q.append('category', c));
  if (S.filter.statuses.length) S.filter.statuses.forEach(s => q.append('status', s));
  q.set('sort', S.sort.key); q.set('order', S.sort.order);
  const [list, stats] = await Promise.all([api('/api/competitions?' + q), api('/api/stats')]);
  S.comps = list.competitions; S.stats = stats;
  const snap = JSON.stringify([S.comps, S.stats, S.filter, S.sort]);
  if (snap !== _lastDataSnap) { _lastDataSnap = snap; render(); }
}
function toast(msg, type = 'ok') {
  const colors = { ok: 'bg-slate-900/90 dark:bg-slate-700/90', warn: 'bg-amber-600/95', err: 'bg-rose-600/95' };
  const icons = { ok: '✅', warn: '⚠️', err: '❌' };
  const el = document.createElement('div');
  el.className = `${colors[type]} text-white text-sm px-4 py-3 rounded-2xl shadow-xl toast-in flex items-center gap-2`;
  el.innerHTML = `<span>${icons[type]}</span><span class="flex-1">${esc(msg)}</span>`;
  $('toast').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3200);
}

/* ---------- 标签路由 ---------- */
const VIEWS = ['home', 'comps', 'ai', 'awards', 'settings'];
function go(view) {
  if (!VIEWS.includes(view)) view = 'home';
  S.view = view;
  try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
  document.querySelectorAll('.tabbar-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  const el = $('view-' + view);
  el.classList.remove('hidden');
  render();
  $('fab').classList.toggle('hidden', !(view === 'comps' || view === 'awards'));
}
function render() {
  if (!S.comps) return;
  if (S.view === 'home') renderHome();
  else if (S.view === 'comps') renderComps();
  else if (S.view === 'awards') renderAwards();
  else if (S.view === 'ai') renderAi();
  else if (S.view === 'settings') renderSettings();
}

/* ---------- 总览 ---------- */
function renderHome() {
  const s = S.stats;
  const urgent = s.upcoming.filter(u => u.countdown <= 7 && !['submitted', 'done', 'abandoned'].includes(u.status));
  const monthDue = s.months.find(m => m.month === s.today.slice(0, 7))?.count ?? 0;
  const cards = [
    { label: '进行中', val: (s.by_status.submitting || 0) + (s.by_status.open || 0) + (s.by_status.urgent || 0) + (s.by_status.not_started || 0), grad: 'from-indigo-500 to-violet-500' },
    { label: '7 天内截止', val: s.due_in_7, grad: 'from-rose-500 to-red-500' },
    { label: '本月截止', val: monthDue, grad: 'from-amber-500 to-orange-500' },
    { label: '已提交 / 完成', val: s.completed, grad: 'from-emerald-500 to-teal-500' },
  ];
  let html = `<div class="grid grid-cols-2 gap-3 mb-4">`;
  for (const c of cards) html += `
    <div class="card p-4 flex items-center gap-3 active:scale-[0.98] transition-transform" onclick="go('comps')">
      <div><div class="text-2xl font-bold leading-tight stat-num">${c.val}</div><div class="muted mt-0.5">${c.label}</div></div>
    </div>`;
  html += `</div>`;
  html += `<div class="card p-4 mb-4">
    <h3 class="font-bold mb-3 flex items-center gap-2 text-[15px]"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-rose-500 to-red-500 inline-block"></span>🚨 紧急区（7 天内）</h3>`;
  if (!urgent.length) html += `<div class="text-center py-8"><div class="text-4xl mb-2">🎉</div><div class="text-slate-500 dark:text-slate-400 text-sm font-medium">7 天内没有要交的比赛</div></div>`;
  else html += `<div class="space-y-2">` + urgent.slice(0, 8).map(c => `
    <div class="flex items-center gap-3 p-3 rounded-xl bg-slate-50/80 dark:bg-slate-700/40 active:bg-slate-100 dark:active:bg-slate-700 transition-colors" onclick="openDetail('${c.id}')">
      <div class="flex-1 min-w-0"><div class="font-medium text-sm truncate">${esc(c.name)}</div>
      <div class="muted mt-0.5">临期线 ${fmtDate(c.suggested_deadline)} · 官方 ${fmtDate(c.deadline)}</div></div>
      ${countdownBadge(c)}</div>`).join('') + `</div>`;
  html += `</div>`;
  html += `<div class="card p-4 mb-2">
    <h3 class="font-bold mb-2 flex items-center gap-2 text-[15px]"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-indigo-500 to-violet-500 inline-block"></span>未来 12 周到期分布</h3>
    <div id="homeChart" style="height:180px"></div></div>`;
  $('view-home').innerHTML = html;
  renderHomeChart();
}
function renderHomeChart() {
  const el = $('homeChart'); if (!el) return;
  const chart = getChart('homeChart');
  chart.setOption({
    grid: { left: 30, right: 8, top: 12, bottom: 22 },
    xAxis: { type: 'category', data: S.stats.weeks.map((_, i) => `${i * 7 + 1}-${Math.min((i + 1) * 7, 84)}天`), axisLabel: { fontSize: 9, color: '#94a3b8', interval: 3 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 9, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } } },
    series: [{ type: 'bar', data: S.stats.weeks, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#8b5cf6' }, { offset: 1, color: '#6366f1' }] }, borderRadius: [5, 5, 0, 0] }, barWidth: '60%' }],
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${p[0].name}<br><b>${p[0].value}</b> 个比赛到期` },
  });
}

/* ---------- 比赛列表（卡片式） ---------- */
function renderComps() {
  const show = S.comps;
  const cur = [...S.filter.statuses];
  const activeSet = (s) => cur.length && s.every(v => cur.includes(v)) && cur.every(v => s.includes(v));
  const chip = (label, statuses) => `<span class="chip ${activeSet(statuses) ? 'chip-on' : 'chip-off'}" data-s='${JSON.stringify(statuses)}' onclick="setStatusFilter(JSON.parse(this.dataset.s))">${label}</span>`;
  let html = `
    <div class="relative mb-3">
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="width:16px;height:16px"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
      </span>

  $('view-comps').innerHTML = html; bindSearch();

}
function renderDueChart() {
  const mode = $('dueMode')?.value || 'suggested';
  const chart = getChart('dueChart');
  const counts = {};
  for (const c of S.comps) {
    if (['submitted', 'done', 'abandoned'].includes(c.status)) continue;
    const d = mode === 'suggested' ? c.suggested_deadline : c.deadline;
    const days = Math.floor((Date.parse(d) - Date.parse(S.stats.today)) / 864e5);
    if (days < 0) continue;
    counts[Math.floor(days / 7)] = (counts[Math.floor(days / 7)] || 0) + 1;
  }
  const weeks = Array.from({ length: 12 }, (_, i) => counts[i] || 0);
  chart.setOption({
    grid: { left: 30, right: 8, top: 12, bottom: 22 },
    xAxis: { type: 'category', data: weeks.map((_, i) => `${i * 7 + 1}-${Math.min((i + 1) * 7, 84)}天`), axisLabel: { fontSize: 9, color: '#94a3b8', interval: 2 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },

    series: [{ type: 'bar', data: weeks, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#f59e0b' }, { offset: 1, color: '#fbbf24' }] }, borderRadius: [5, 5, 0, 0] }, barWidth: '60%' }],

  });
}
function renderCategoryChart() {
  const chart = getChart('catChart');
  const cats = Object.entries(S.stats.by_category).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  chart.setOption({
    color: ['#8b5cf6', '#f43f5e', '#10b981', '#f59e0b', '#0ea5e9', '#a78bfa', '#94a3b8'],
    series: [{ type: 'pie', radius: ['42%', '66%'], center: ['50%', '52%'], data: cats, label: { fontSize: 10, formatter: '{b} {c}', color: '#64748b' }, itemStyle: { borderRadius: 5, borderColor: '#fff', borderWidth: 2 } }],
    tooltip: { trigger: 'item', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${esc(p.name)}：<b>${p.value}</b> 个（${p.percent}%）` },
  });
  chart.on('click', p => { S.filter.cats = [p.name]; S.filter.statuses = []; go('comps'); refresh(); });
}
function renderMonthChart() {
  const chart = getChart('monChart');
  const today = S.stats.today;
  const day = 864e5;
  const ts = (s) => Date.parse(s);
  const weeks = [];
  for (let w = 0; w < 5; w++) {
    const start = ts(today) + w * 7 * day;
    const d = new Date(start);
    weeks.push({ start, end: start + 7 * day, name: `${d.getMonth() + 1}/${d.getDate()}`, value: 0 });
  }
  const active = S.comps.filter(c => !['submitted', 'done', 'abandoned', 'overdue'].includes(c.status));
  for (const c of active) {
    const t = ts(c.suggested_deadline || c.deadline);
    for (const wk of weeks) { if (t >= wk.start && t < wk.end) { wk.value++; break; } }
  }
  chart.setOption({
    grid: { left: 30, right: 8, top: 14, bottom: 22 },
    xAxis: { type: 'category', data: weeks.map(w => w.name), axisLabel: { color: '#94a3b8', fontSize: 9 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 9, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } } },
    series: [{ type: 'line', data: weeks.map(w => w.value), smooth: true, symbolSize: 8, lineStyle: { color: '#8b5cf6', width: 3 }, itemStyle: { color: '#8b5cf6', borderColor: '#fff', borderWidth: 2 }, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(139,92,246,0.28)' }, { offset: 1, color: 'rgba(139,92,246,0.02)' }] } } }],
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${weeks[p[0].dataIndex].name} 起那周<br><b>${p[0].value}</b> 个比赛到期` },
  });
}

  for (let gi = 0; gi < groupKeys.length; gi++) {

              ${a.is_first_author ? `<span class="badge bg-amber-50 text-amber-600 dark:bg-amber-900/30 dark:text-amber-300 !px-2 !py-0.5 !text-[10px]">✍️ 一作</span>` : ''}

          <div class="muted shrink-0 text-right">${a.award_date ? fmtDate(a.award_date) : ''}<div class="mt-1">${(a.certificate_files || []).length ? '📎' : ''}</div></div>
        </div>
      </div>`).join('') + `</div>`;
  }
  $('view-awards').innerHTML = html;
}
/* ---------- 获奖分组折叠（与 PC 版同款逻辑） ---------- */
function awardGroupSaved() {
  try { return JSON.parse(localStorage.getItem('wc_awards_groups') || '{}') || {}; } catch (e) { return {}; }
}
function awardGroupOpen(key, count) {
  if (S_AWARDS.filter.keyword || S_AWARDS.filter.level || S_AWARDS.filter.first) return true;
  const saved = awardGroupSaved();
  if (key in saved) return !!saved[key];
  return count <= 1;
}
function toggleAwardGroup(gi) {
  const key = (S_AWARDS._groupKeys || [])[gi];
  if (key === undefined) return;
  const list = $('awg_' + gi), chev = $('awc_' + gi);
  const nowOpen = !!(list && list.style.display !== 'none');
  if (list) list.style.display = nowOpen ? 'none' : '';
  if (chev) chev.classList.toggle('rotate-90', !nowOpen);
  const saved = awardGroupSaved();
  saved[key] = !nowOpen;
  try { localStorage.setItem('wc_awards_groups', JSON.stringify(saved)); } catch (e) {}
}
function setAllAwardGroups(open) {
  const keys = S_AWARDS._groupKeys || [];
  const saved = awardGroupSaved();

function pickCert() { $('certFile').click(); }
async function uploadCert(input) {
  const f = input.files[0]; if (!f) return;
  if (f.size > 50 * 1024 * 1024) { toast('文件过大（上限 50MB）', 'err'); input.value = ''; return; }
  const buf = await f.arrayBuffer();
  let b64 = '';
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += 32768) b64 += String.fromCharCode(...u8.subarray(i, i + 32768));
  b64 = btoa(b64);
  try {
    const r = await api('/api/certificates', { method: 'POST', body: { name: f.name, data: b64 } });
    AWARD_CERTS.push(r.filename);
    renderCertList();
    toast('凭证已上传');
  } catch (e) { toast('上传失败：' + e.message, 'err'); }
  input.value = '';
}

async function submitForm() {
  const name = $('f_name').value.trim(), deadline = $('f_deadline').value;
  if (!name || !deadline) return toast('名称和官方截止是必填项', 'warn');
  const suggested = $('f_suggested').value || null;
  if (suggested && suggested > deadline) return toast('临期线不能晚于官方截止', 'warn');
  const body = {
    name, deadline,
    suggested_deadline: suggested,
    deadline_buffer_days: $('f_buffer').value !== '' ? Number($('f_buffer').value) : null,
    category: $('f_category').value.trim(), organizer: $('f_organizer').value.trim(), website: $('f_website').value.trim(),
    signup_start: $('f_signup_start').value || null, signup_end: $('f_signup_end').value || null,
    requirements: $('f_requirements').value,
    deliverables: $('f_deliverables').value.split('\n').map(s => s.trim()).filter(Boolean),
    submission: {
      method: $('f_sub_method').value.trim(), target: $('f_sub_target').value.trim(),
      fee: $('f_sub_fee').value.trim(), contact: $('f_sub_contact').value.trim(),
    },
    format: {
      file_types: $('f_fmt_types').value.split(',').map(s => s.trim()).filter(Boolean),
      max_size_mb: $('f_fmt_size').value !== '' ? Number($('f_fmt_size').value) : null,
      naming: $('f_fmt_naming').value.trim(),
    },
    milestones: $('f_milestones').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [n, ...rest] = l.split(':'); return { name: n.trim(), date: rest.join(':').trim() };
    }),
    notes: $('f_notes').value,
  };
  try {
    if (S.editingId) await api('/api/competitions/' + S.editingId, { method: 'PUT', body });
    else await api('/api/competitions', { method: 'POST', body });
    toast(S.editingId ? '已保存' : '已添加 🎉'); closeForm(); refresh();
  } catch (e) { toast('保存失败：' + e.message, 'err'); }
}

async function doBackup() {
  const r = await api('/api/backup', { method: 'POST' });
  toast('已备份：' + r.backup);
  $('backupInfo').textContent = '最近备份：' + r.backup;
}
async function doImportText() {
  const text = $('impText').value.trim();
  if (!text) return toast('请先粘贴内容', 'warn');
  try {
    const r = await api('/api/import', { method: 'POST', body: { text } });
    showImportReport(r.report); pushImportHistory(r.report);
    $('impText').value = ''; refresh();
  } catch (e) { toast('导入失败：' + e.message, 'err'); }
}
async function doImportFile(input) {
  const f = input.files[0]; if (!f) return;
  const text = await f.text();
  try {
    const r = await api('/api/import', { method: 'POST', body: { text } });
    showImportReport(r.report); pushImportHistory(r.report);
    refresh();
  } catch (e) { toast('导入失败：' + e.message, 'err'); }
  input.value = '';
}
function pickFile() { $('impFile').click(); }
function showImportReport(r) {
  const parts = [];
  if (r.added) parts.push(`新增 ${r.added} 条`);
  if (r.updated) parts.push(`更新 ${r.updated} 条`);
  if (r.skipped) parts.push(`跳过重复 ${r.skipped} 条`);
  if (r.errors?.length) parts.push(`失败 ${r.errors.length} 条`);
  toast(parts.join('、') || '无变化', r.errors?.length ? 'warn' : 'ok');
}
function pushImportHistory(report) {
  S.importHistory.unshift({ time: new Date().toLocaleString(), report });
  S.importHistory = S.importHistory.slice(0, 20);
  try { localStorage.setItem('wc_import_history', JSON.stringify(S.importHistory)); } catch (e) {}
}
function renderImportHistory(targetId) {
  const el = $(targetId); if (!el) return;
  if (!S.importHistory.length) { el.innerHTML = '<div class="muted py-2 text-center">暂无导入记录</div>'; return; }
  el.innerHTML = S.importHistory.slice(0, 6).map(h => `
    <div class="text-xs py-2 border-b border-slate-100 dark:border-slate-700 last:border-0 flex justify-between gap-2">
      <span class="muted">${h.time}</span>
      <span class="text-slate-500 dark:text-slate-300">+${h.report.added} · ~${h.report.updated} · 重${h.report.skipped}</span>
    </div>`).join('');
}
function toggleTheme() {
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  const sun = $('themeSun'), moon = $('themeMoon');
  if (sun && moon) { sun.classList.toggle('hidden', !S.dark); moon.classList.toggle('hidden', S.dark); }
  localStorage.setItem('ds_theme', S.dark ? 'dark' : 'light');
  try { applyWallpaper(); } catch (e) {}
  render();
}

  }).join('') + (S.ai.busy ? `<div class="flex justify-start"><div class="card px-4 py-2.5 text-sm muted">⏳ <span id="aiBusyText">思考中…</span></div></div>` : '');

function aiQuick(t) { $('aiInput').value = t; aiSend(); }
function aiSetBusy(text) { const el = $('aiBusyText'); if (el) el.textContent = text; }
async function aiSend() {
  if (S.ai.busy) return;
  const input = $('aiInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const images = S.ai.attach.filter(a => a.kind === 'image').map(a => a.dataUrl);
  const tables = S.ai.attach.filter(a => a.kind === 'table');
  let fullText = text;
  for (const t of tables) fullText += '\n\n【附件文件 ' + t.name + ' 的内容】\n' + t.text;
  S.ai.messages.push({ role: 'user', content: fullText, images });
  S.ai.attach = [];
  aiRenderAttach();
  S.ai.busy = true;
  renderAiMsgs();
  try {
    const toSend = S.ai.messages.slice(-20).map(m => {
      if (m.role === 'user' && m.images?.length) {
        return { role: 'user', content: [{ type: 'text', text: m.content || '请识别这张获奖证书' },
          ...m.images.map(u => ({ type: 'image_url', image_url: { url: u } }))] };
      }
      return { role: m.role, content: m.content };
    });
    let r;
    if (IS_LOCAL) r = await aiChatJs(toSend, (t) => aiSetBusy(t));
    else r = await api('/api/ai_chat', { method: 'POST', body: { messages: toSend } });
    if (r.ok) S.ai.messages.push({ role: 'assistant', content: r.reply, trace: r.trace });
    else {
      const raw = r.raw ? ('原始响应: ' + String(r.raw).slice(0, 180)) : '';
      S.ai.messages.push({ role: 'assistant', content: '⚠️ ' + (r.error || '未知错误') + (raw ? '\n🔍 ' + raw : '') });
      reportClientError('AI 任务失败: ' + (r.error || '未知错误'));
    }
    if (r.trace?.some(t => ['add_competition', 'update_competition', 'delete_competition'].includes(t.tool))) refresh();
    const awardTrace = (r.trace || []).find(t => t.tool === 'add_award' && t.result_id);
    if (awardTrace && images.length) {
      const saved = await aiAttachCerts(awardTrace.result_id, images);
      if (saved.length) toast('证书图片已存为凭证：' + saved.join('、'));
    }
  } catch (e) {
    S.ai.messages.push({ role: 'assistant', content: '⚠️ ' + e.message });
    reportClientError('AI 发送失败: ' + e.message, e.stack);
  } finally {
    S.ai.busy = false;
    renderAiMsgs();
    try { localStorage.setItem('wc_ai_chat', JSON.stringify(S.ai.messages.slice(-50).map(m => ({ role: m.role, content: m.content, trace: m.trace })))); } catch (e) {}
  }
}

/* ---------- 图片全屏查看器：双指缩放 / 双击放大 / 拖动（2026-10-16） ---------- */
function wcViewImage(src) {
  const old = document.getElementById('wcImageViewer'); if (old) old.remove();
  const v = document.createElement('div');
  v.id = 'wcImageViewer';
  v.innerHTML = `<div class="wciv-close" role="button" aria-label="关闭">✕</div>
    <img src="${src}" alt="查看图片"><div class="wciv-hint">双指缩放 · 双击放大 · 点空白关闭</div>`;
  document.body.appendChild(v);
  const img = v.querySelector('img');
  let scale = 1, tx = 0, ty = 0, pinchDist = 0, pinchScale = 1, lastTap = 0;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const close = () => { v.remove(); document.removeEventListener('keydown', esc); };
  const esc = e => { if (e.key === 'Escape') close(); };
  v.querySelector('.wciv-close').addEventListener('click', e => { e.stopPropagation(); close(); });
  v.addEventListener('click', e => { if (e.target === v || e.target === img) close(); });
  document.addEventListener('keydown', esc);
  /* 双击：1x ↔ 2.5x（以点击点为中心） */
  img.addEventListener('click', e => {
    e.stopPropagation();
    const now = Date.now();
    if (now - lastTap < 300) {
      const r = img.getBoundingClientRect();
      const px = e.clientX - r.left - r.width / 2, py = e.clientY - r.top - r.height / 2;
      if (scale > 1.05) { scale = 1; tx = 0; ty = 0; }
      else { const ns = 2.5; tx -= px * (ns - scale); ty -= py * (ns - scale); scale = ns; }
      apply();
    }
    lastTap = now;
  });
  /* 双指缩放 + 单指拖动 */
  const pointers = new Map();
  v.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    v.setPointerCapture && v.setPointerCapture(e.pointerId);
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y); pinchScale = scale;
    }
  });
  v.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) { scale = Math.min(8, Math.max(.4, pinchScale * d / pinchDist)); apply(); }
    } else if (pointers.size === 1) {
      img.classList.add('wcDragging');
      tx += dx; ty += dy; apply();
    }
  });
  const up = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0) img.classList.remove('wcDragging');
  };
  v.addEventListener('pointerup', up);
  v.addEventListener('pointercancel', up);
}

/* ---------- 初始化 ---------- */
(async function init() {
  S.dark = localStorage.getItem('ds_theme') === 'dark';
  document.documentElement.classList.toggle('dark', S.dark);
  const sun0 = $('themeSun'), moon0 = $('themeMoon');
  if (sun0 && moon0) { sun0.classList.toggle('hidden', !S.dark); moon0.classList.toggle('hidden', S.dark); }
  const initialView = (location.hash || '#home').slice(1);
  try {
    const h = await api('/api/health');
    S.port = h.port ?? '';
    S.dataDir = h.data_dir || '';
  } catch (e) { S.port = ''; }
  try { S.importHistory = JSON.parse(localStorage.getItem('wc_import_history') || '[]') || []; } catch (e) { S.importHistory = []; }
  try { S.ai.messages = JSON.parse(localStorage.getItem('wc_ai_chat') || '[]') || []; } catch (e) {}
  await refresh();
  refreshAwards().catch(() => {});
  go(VIEWS.includes(initialView) ? initialView : 'home');
  setInterval(() => { refresh().catch(() => {}); refreshAwards().catch(() => {}); }, 60000);
  /* 安卓返回手势/返回键：由 @capacitor/app 插件接管——全屏页打开时先关页，主界面再退出 */
  const App = window.Capacitor?.Plugins?.App;
  const topOverlay = () => {
    for (const id of ['scanOverlay', 'formPage', 'detailPage', 'awardFormPage', 'awardDetailPage']) {
      const el = document.getElementById(id);
      if (el && !el.classList.contains('hidden')) return { id, el };
      if (id === 'scanOverlay' && el) return { id, el };  /* 扫码层存在即打开 */
    }
    return null;
  };
  if (App?.addListener) {
    App.addListener('backButton', () => {
      const t = topOverlay();
      if (!t) { App.exitApp(); return; }
      if (t.id === 'scanOverlay') closeScanOverlay();
      else if (t.id === 'formPage') closeForm();
      else if (t.id === 'detailPage') closeDetail();
      else if (t.id === 'awardFormPage') closeAwardForm();
      else if (t.id === 'awardDetailPage') closeAwardDetail();
    });
  }
  /* 桌面浏览器/键盘：Esc 关全屏页 */
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (scanOverlayOpen()) return closeScanOverlay();
    if (!$('formPage').classList.contains('hidden')) return closeForm();
    if (!$('detailPage').classList.contains('hidden')) return closeDetail();
    if (!$('awardFormPage').classList.contains('hidden')) return closeAwardForm();
    if (!$('awardDetailPage').classList.contains('hidden')) return closeAwardDetail();
  });
})().catch(e => { console.error(e); window.alert('启动未完成：' + (e.message || e) + '\n请保留数据目录，勿卸载或清空数据。'); });

</script>
