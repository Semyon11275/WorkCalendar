<style type="text/tailwindcss">
  body { font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; }

  /* ---------- 基础 ---------- */
  .card { @apply bg-white dark:bg-slate-800/80 rounded-2xl border border-slate-200/70 dark:border-slate-700/70 shadow-[0_1px_3px_rgba(15,23,42,0.04)] transition-shadow duration-300; }
  .card-hover { @apply hover:shadow-[0_8px_24px_rgba(99,102,241,0.10)] hover:-translate-y-0.5 transition-all duration-300; }
  .nav-item { @apply relative flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl text-sm text-slate-600 dark:text-slate-300 cursor-pointer transition-all duration-200 select-none; }
  .nav-item:hover { @apply bg-slate-100/80 dark:bg-slate-700/50 text-slate-900 dark:text-white; }
  .nav-item.active { @apply bg-gradient-to-r from-indigo-500 to-violet-500 text-white font-medium shadow-md shadow-indigo-500/25; }
  .nav-item.active:hover { @apply text-white; }
  .badge { @apply inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium whitespace-nowrap; }
  .btn { @apply inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl text-sm font-medium cursor-pointer transition-all duration-200 select-none active:scale-[0.97]; }
  .btn-primary { @apply bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-md shadow-indigo-500/25 hover:shadow-lg hover:shadow-indigo-500/35 hover:brightness-110; }
  .btn-ghost { @apply bg-slate-100 text-slate-700 hover:bg-slate-200 dark:bg-slate-700/60 dark:text-slate-200 dark:hover:bg-slate-600/70; }
  .btn-danger { @apply bg-rose-50 text-rose-600 hover:bg-rose-100 dark:bg-rose-900/25 dark:text-rose-300 dark:hover:bg-rose-900/40; }
  .input { @apply w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400/60 focus:border-indigo-400 transition-shadow; }
  .label { @apply block text-xs text-slate-500 dark:text-slate-400 mb-1.5 font-medium; }
  .muted { @apply text-slate-400 dark:text-slate-400 text-xs; }
  th { @apply px-4 py-3 text-left text-xs text-slate-400 dark:text-slate-500 font-semibold tracking-wide whitespace-nowrap; font-variant-numeric: tabular-nums; }
  td { @apply px-4 py-3 text-sm whitespace-nowrap; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { @apply bg-slate-300/80 dark:bg-slate-600/80 rounded-full hover:bg-slate-400; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 细节质感 ---------- */
  /* 数字等宽：倒计时/日期/统计对齐不跳动 */
  .tabular, .stat-num, .countdown { font-variant-numeric: tabular-nums; }
  /* 文字选中：品牌色系 */
  ::selection { background: rgba(99, 102, 241, 0.18); }
  * { -webkit-tap-highlight-color: transparent; }
  /* 标题防孤行 */
  h1, h2, h3, h4 { text-wrap: balance; }
  /* 键盘焦点可见（仅键盘） */
  button:focus-visible, input:focus-visible, select:focus-visible, .nav-item:focus-visible { outline: 2px solid rgba(99, 102, 241, 0.55); outline-offset: 2px; }
  /* 减少动效偏好：全部动画/过渡降级为瞬时 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  /* 时间线图表区：手写双列网格（不依赖 Tailwind 运行时，修复宽屏单列堆叠/溢出） */
  .tl-grid-2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1024px) { .tl-grid-2 { grid-template-columns: 1fr 1fr; } }

  /* AI 助手页：高度锁定视口，输入框始终可见 */
  #view-ai { height: calc(100dvh - 130px); display: flex; flex-direction: column; }
  #view-ai.hidden { display: none; }

  /* ---------- 动画 ---------- */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .anim-in { animation: fadeUp 0.35s ease both; }
  @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .drawer-in { animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes toastIn { from { transform: translateY(12px) scale(0.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  .toast-in { animation: toastIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes modalPop { from { transform: translate(-50%, -50%) scale(0.94); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .modal-in { animation: modalPop 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes pulseSoft { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }
  .pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }

  .tr-row { @apply transition-colors duration-150; }
  .tr-row:hover { @apply bg-indigo-50/60 dark:bg-indigo-900/20; }
  .bar-urgent { border-left: 4px solid #f43f5e; }
  .bar-soon { border-left: 4px solid #f59e0b; }
  .bar-calm { border-left: 4px solid #10b981; }
  .bar-done { border-left: 4px solid #94a3b8; }

  /* ---------- 移动端适配(≤768px,手机浏览器/安卓壳) ---------- */
  @media (max-width: 768px) {
    .mobile-hide { display: none !important; }
    /* 视口高度用 dvh，键盘弹起/工具栏收放时不溢出 */
    body { height: 100dvh !important; }
    #searchBox { width: 104px !important; }
    header { padding-left: 10px !important; padding-right: 10px !important; gap: 6px !important; }
    #mainArea { padding: 10px 10px calc(74px + env(safe-area-inset-bottom, 0px)) !important; }
    /* 侧栏 → 底部导航栏（含手势区安全距离） */
    nav {
      position: fixed; inset: auto 0 0 0; width: 100% !important; height: calc(60px + env(safe-area-inset-bottom, 0px));
      flex-direction: row !important; align-items: stretch; padding: 5px 4px env(safe-area-inset-bottom, 0px);
      border-right: 0 !important; border-top: 1px solid rgba(148,163,184,0.3);
      background: rgba(255,255,255,0.96) !important; z-index: 40;
    }
    .dark nav { background: rgba(30,41,59,0.96) !important; }
    nav > * { margin-top: 0 !important; }
    nav .nav-label, nav .nav-spacer, #portInfo { display: none !important; }
    nav .nav-item {
      flex: 1; flex-direction: column; gap: 1px; padding: 3px 0;
      font-size: 10px; border-radius: 10px; justify-content: center;
    }
    nav .nav-item svg { width: 20px; height: 20px; }
    /* 表单/获奖弹窗 → 手机全屏页（去掉居中卡片与圆角） */
    #formModal > div, #awardModal > div {
      width: 100% !important; max-width: 100% !important;
      height: 100% !important; max-height: 100% !important;
      border-radius: 0 !important; padding: 16px !important;
    }
    #formModal .grid, #awardModal .grid { grid-template-columns: 1fr !important; }
    #formModal .grid > .col-span-2, #awardModal .grid > .col-span-2 { grid-column: 1 / -1 !important; }
    .view .card { border-radius: 16px; }
    /* 列表页：手机只留 名称/临期线/倒计时 三列，表格宽度自适应，不再横向滚动 */
    #view-list table, #view-awards table { min-width: 0 !important; width: 100% !important; }
    #view-list td, #view-list th, #view-awards td, #view-awards th { white-space: normal; }
    #view-list .badge, #view-awards .badge { white-space: nowrap; }
    #view-list th:nth-child(2), #view-list td:nth-child(2),
    #view-list th:nth-child(4), #view-list td:nth-child(4),
    #view-list th:nth-child(6), #view-list td:nth-child(6),
    #view-list th:last-child, #view-list td:last-child { display: none; }
    #view-list td:first-child { max-width: none !important; }
    /* 获奖页：手机隐藏 作者/凭证/操作 列（点行进详情即可） */
    #view-awards th:nth-child(4), #view-awards td:nth-child(4),
    #view-awards th:nth-child(6), #view-awards td:nth-child(6),
    #view-awards th:last-child, #view-awards td:last-child { display: none; }
    /* 手机横滚流畅：横向手势优先给表格容器，避免与页面竖向滚动抢手势 */
    #view-list .card, #view-awards .card {
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    #view-list td { padding: 10px 8px; font-size: 13px; }
    #view-list th { padding: 10px 8px; font-size: 11px; }
    /* 详情抽屉：手机全屏 */
    #drawerPanel { width: 100% !important; max-width: 100% !important; }
    /* Toast 移到底部导航上方 */
    #toast { bottom: calc(70px + env(safe-area-inset-bottom, 0px)) !important; left: 12px; right: 12px; }
    /* 总览：统计卡与紧急区字距 */
    #view-overview .card { padding: 14px !important; }
    #view-overview .grid-cols-2 .card { padding: 12px !important; }
    .view h3 { line-height: 1.4; }
    .view table td { line-height: 1.5; }
  }
</style>
</head>
<body class="bg-[#f6f7fb] dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden">

<!-- 顶栏 -->
<header class="h-16 shrink-0 flex items-center gap-2 xl:gap-3 px-4 xl:px-5 bg-white/80 dark:bg-slate-800/80 backdrop-blur-lg border-b border-slate-200/60 dark:border-slate-700/60 sticky top-0 z-30">
  <div class="flex items-center gap-2.5 shrink-0">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center shadow-md shadow-indigo-500/30" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white">
        <rect x="3" y="5" width="18" height="16" rx="3"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <line x1="8" y1="3" x2="8" y2="7"/>
        <line x1="16" y1="3" x2="16" y2="7"/>
        <path d="m9 14.5 2 2 4-4"/>
      </svg>
    </div>
    <div>
      <div class="text-[15px] font-bold leading-tight bg-gradient-to-r from-indigo-600 to-violet-600 dark:from-indigo-400 dark:to-violet-400 bg-clip-text text-transparent">工作日历</div>
      <div class="text-[10px] muted hidden lg:block">WorkCalendar · 本地单机</div>
    </div>
  </div>
  <div class="flex-1 min-w-2"></div>
  <div class="relative shrink-0">
    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" class="w-4 h-4"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
    </span>
    <input id="searchBox" class="input !w-36 xl:!w-52 !pl-9 !py-2 !rounded-full" placeholder="搜索…" autocomplete="off">
  </div>
  <select id="catFilter" class="input !w-24 xl:!w-28 !py-2 !rounded-full !text-xs shrink-0 mobile-hide"></select>
  <select id="statusFilter" class="input !w-28 xl:!w-32 !py-2 !rounded-full !text-xs shrink-0 mobile-hide"></select>
  <button class="btn btn-primary !py-2 shrink-0 whitespace-nowrap !px-3" onclick="openForm()"><span class="hidden sm:inline">＋ 添加比赛</span><span class="sm:hidden text-base leading-none">＋</span></button>
  <button class="btn btn-ghost !py-2 shrink-0 whitespace-nowrap mobile-hide" onclick="go('import')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><line x1="4" y1="20" x2="20" y2="20"/></svg>
    导入
  </button>
  <button id="themeBtn" class="btn btn-ghost !py-2 !px-3 shrink-0" onclick="toggleTheme()" title="深色/浅色" aria-label="切换深色/浅色模式">
    <svg id="themeMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4" aria-hidden="true"><path d="M20 13.5A8 8 0 1 1 10.5 4a6.5 6.5 0 0 0 9.5 9.5Z"/></svg>
    <svg id="themeSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 hidden" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.2" y1="5.2" x2="7" y2="7"/><line x1="17" y1="17" x2="18.8" y2="18.8"/><line x1="5.2" y1="18.8" x2="7" y2="17"/><line x1="17" y1="7" x2="18.8" y2="5.2"/></svg>
  </button>
</header>

<div class="flex-1 flex overflow-hidden">
  <!-- 侧栏 -->
  <nav class="w-48 shrink-0 p-3 space-y-1 bg-white/70 dark:bg-slate-800/70 backdrop-blur-lg border-r border-slate-200/60 dark:border-slate-700/60 flex flex-col">
    <div class="nav-label px-3.5 pt-2 pb-1.5 text-[10px] font-bold tracking-widest text-slate-300 dark:text-slate-500">浏览</div>
    <div class="nav-item active" data-view="overview" onclick="go('overview')" role="button" tabindex="0" aria-label="总览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      总览</div>
    <div class="nav-item" data-view="list" onclick="go('list')" role="button" tabindex="0" aria-label="列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      列表</div>
    <div class="nav-item" data-view="timeline" onclick="go('timeline')" role="button" tabindex="0" aria-label="时间线">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      时间线</div>
    <div class="nav-item" data-view="ai" onclick="go('ai')" role="button" tabindex="0" aria-label="AI 助手">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><rect x="4" y="8" width="16" height="11" rx="3"/><circle cx="9" cy="13.5" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="13.5" r="1" fill="currentColor" stroke="none"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1" fill="currentColor" stroke="none"/></svg>
      AI 助手</div>
    <div class="nav-label px-3.5 pt-3 pb-1.5 text-[10px] font-bold tracking-widest text-slate-300 dark:text-slate-500">管理</div>
    <div class="nav-item" data-view="awards" onclick="go('awards')" role="button" tabindex="0" aria-label="获奖">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 5.5H5a3 3 0 0 0 3 4"/><path d="M16 5.5h3a3 3 0 0 1-3 4"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="7" y1="20" x2="17" y2="20"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
      获奖</div>
    <div class="nav-item" data-view="settings" onclick="go('settings')" role="button" tabindex="0" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="w-[18px] h-[18px] shrink-0" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="17" r="2.2"/></svg>
      设置</div>
    <div class="nav-spacer flex-1"></div>
    <div id="portInfo" class="px-3.5 py-2 text-[10px] muted bg-slate-50 dark:bg-slate-700/40 rounded-xl leading-relaxed"></div>
  </nav>

  <!-- 主区 -->
  <main class="flex-1 overflow-y-auto p-6" id="mainArea">
    <div id="view-overview" class="view hidden"></div>
    <div id="view-list" class="view hidden"></div>
    <div id="view-timeline" class="view hidden"></div>
    <div id="view-charts" class="view hidden"></div>
    <div id="view-ai" class="view hidden"></div>
    <div id="view-awards" class="view hidden"></div>
    <div id="view-import" class="view hidden"></div>
    <div id="view-settings" class="view hidden"></div>
  </main>
</div>

<!-- 详情抽屉 -->
<div id="drawer" class="fixed inset-0 z-40 hidden">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]" onclick="closeDrawer()"></div>
  <div id="drawerPanel" class="absolute right-0 top-0 h-full w-[500px] max-w-[94vw] bg-slate-50 dark:bg-slate-800 shadow-2xl overflow-y-auto drawer-in"></div>
</div>

<!-- 添加/编辑模态框 -->
<div id="formModal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px]" onclick="closeForm()"></div>
  <div class="modal-in absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[660px] max-w-[94vw] max-h-[88vh] overflow-y-auto bg-white dark:bg-slate-800 rounded-3xl shadow-2xl p-7 border border-slate-200/60 dark:border-slate-700">
    <div class="flex items-center justify-between mb-5">
      <h3 id="formTitle" class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">添加比赛</h3>
      <button class="btn btn-ghost !px-2.5 !py-1.5 text-xs" onclick="closeForm()">✕</button>
    </div>
    <div class="grid grid-cols-2 gap-3.5">
      <div class="col-span-2"><label class="label">比赛名称 *</label><input id="f_name" class="input" placeholder="如：2026 中国包装创意设计大赛"></div>
      <div><label class="label">官方截止 *</label><input id="f_deadline" type="date" class="input"></div>
      <div><label class="label">临期线（留空=自动缓冲）</label><input id="f_suggested" type="date" class="input"></div>
      <div><label class="label">缓冲天数（默认 3）</label><input id="f_buffer" type="number" min="0" class="input"></div>
      <div><label class="label">类别</label><input id="f_category" class="input" list="catList" placeholder="视觉传达 / 工业设计…"><datalist id="catList"></datalist></div>
      <div class="col-span-2"><label class="label">主办方</label><input id="f_organizer" class="input"></div>
      <div class="col-span-2"><label class="label">官网链接</label><input id="f_website" class="input" placeholder="https://…"></div>
      <div><label class="label">报名开始</label><input id="f_signup_start" type="date" class="input"></div>
      <div><label class="label">报名结束</label><input id="f_signup_end" type="date" class="input"></div>
      <div class="col-span-2"><label class="label">作品要求</label><textarea id="f_requirements" rows="3" class="input"></textarea></div>
      <div class="col-span-2"><label class="label">交付物（每行一个）</label><textarea id="f_deliverables" rows="2" class="input" placeholder="展板 JPG 1920×1080 ×1&#10;设计说明 PDF ×1"></textarea></div>
      <div class="col-span-2"><label class="label">投稿方式</label><input id="f_sub_method" class="input" placeholder="在线提交 / 邮箱 / 邮寄"></div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 z-[60] space-y-2.5"></div>

<script src="./core.js"></script>
<script>
let refreshTimer = null;
let _lastDataSnap = '';
async function refresh() {
  const q = new URLSearchParams();
  if (S.filter.keyword) q.set('keyword', S.filter.keyword);
  if (S.filter.cats.length) S.filter.cats.forEach(c => q.append('category', c));
  if (S.filter.statuses.length) S.filter.statuses.forEach(s => q.append('status', s));
  q.set('sort', S.sort.key); q.set('order', S.sort.order);
  const [list, stats] = await Promise.all([api('/api/competitions?' + q), api('/api/stats')]);
  S.comps = list.competitions; S.stats = stats;
  /* 数据无变化时跳过重渲染：避免 60s 后台刷新打断用户（气泡/滚动/输入全保留） */
  const snap = JSON.stringify([S.comps, S.stats, S.filter, S.sort]);
  if (snap !== _lastDataSnap) { _lastDataSnap = snap; fillFilterOptions(); render(); }
}
function toast(msg, type = 'ok') {
  const icons = { ok: '✅', warn: '⚠️', err: '❌' };
  const colors = { ok: 'bg-slate-900/90 dark:bg-slate-700/90', warn: 'bg-amber-600/95', err: 'bg-rose-600/95' };
  const el = document.createElement('div');
  el.className = `${colors[type]} text-white text-sm px-4 py-3 rounded-2xl shadow-xl backdrop-blur toast-in flex items-center gap-2`;
  el.innerHTML = `<span>${icons[type]}</span><span>${esc(msg)}</span>`;
  $('toast').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 320); }, 3800);
}

/* 启动/刷新时的临期横幅（M6：7 天内截止提示） */
function showUrgentBanner() {
  const old = $('urgentBanner');
  if (old) old.remove();
  const n = S.stats ? S.stats.due_in_7 : 0;
  if (!n) return;
  /* 用户关闭后当天不再弹；紧急数量变化（新比赛进入 7 天窗口）才重新提醒 */
  try {
    const off = JSON.parse(localStorage.getItem('wc_urgent_banner_off') || 'null');
    if (off && off.date === new Date().toISOString().slice(0, 10) && off.count === n) return;
  } catch (e) {}
  const el = document.createElement('div');
  el.id = 'urgentBanner';
  el.className = 'mx-1 mb-4 px-4 py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-red-500 text-white text-sm shadow-lg shadow-rose-500/25 flex items-center gap-3 anim-in';
  el.innerHTML = `<span class="text-lg">🚨</span><span class="flex-1"><b>${n}</b> 个比赛 7 天内截止（按临期线），抓紧安排！</span>
    <button class="btn !bg-white/25 !py-1 !px-3 text-xs hover:!bg-white/40" onclick="go('list')">查看</button>
    <button class="btn !bg-white/25 !py-1 !px-2 text-xs" title="关闭（今天不再提醒）" onclick="dismissUrgentBanner()">✕</button>`;
  $('mainArea').prepend(el);
}
function dismissUrgentBanner() {
  try { localStorage.setItem('wc_urgent_banner_off', JSON.stringify({
    date: new Date().toISOString().slice(0, 10), count: S.stats ? S.stats.due_in_7 : 0 })); } catch (e) {}
  const b = $('urgentBanner'); if (b) b.remove();
}

/* ================= 视图 ================= */
function go(view) {
  S.view = view;
  try { if (location.hash !== '#' + view) location.hash = view; } catch (e) { /* 忽略 */ }
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === view));
  document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
  const el = $('view-' + view);
  el.classList.remove('hidden');
  el.classList.remove('anim-in'); void el.offsetWidth; el.classList.add('anim-in');
  render();
}
function render() {
  if (!S.comps) return;
  showUrgentBanner();
  const v = S.view;
  if (v === 'overview') renderOverview();
  else if (v === 'list') renderList();
  else if (v === 'timeline') renderTimeline();
  else if (v === 'charts') renderCharts();
  else if (v === 'ai') renderAi();
  else if (v === 'awards') renderAwards();
  else if (v === 'import') renderImport();
  else if (v === 'settings') renderSettings();
  $('portInfo').innerHTML = `📍 端口 ${S.port ?? '…'}<br>📦 ${S.stats ? S.stats.total + ' 个比赛' : ''}`;
}

/* ---------- 总览 ---------- */
function renderOverview() {
  const s = S.stats;
  const urgent = S.stats.upcoming.filter(u => u.countdown <= 7 && !['submitted', 'done', 'abandoned'].includes(u.status));
  const monthDue = s.months.find(m => m.month === s.today.slice(0, 7))?.count ?? 0;
  const cards = [
    { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>', label: '进行中', val: (s.by_status.submitting || 0) + (s.by_status.open || 0) + (s.by_status.urgent || 0) + (s.by_status.not_started || 0), grad: 'from-indigo-500 to-violet-500', onClick: "setStatusFilter(['submitting','open','urgent','not_started'])" },
    { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white" aria-hidden="true"><path d="M12 4 2.5 19.5h19L12 4Z"/><line x1="12" y1="10" x2="12" y2="14"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/></svg>', label: '7 天内截止', val: s.due_in_7, grad: 'from-rose-500 to-red-500', onClick: "setStatusFilter(['urgent'])" },
    { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>', label: '本月截止', val: monthDue, grad: 'from-amber-500 to-orange-500', onClick: "setStatusFilter(['urgent'])" },
    { icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-white" aria-hidden="true"><path d="M5 21V4"/><path d="M5 5h11l-2.5 4L16 13H5"/></svg>', label: '已提交 / 完成', val: s.completed, grad: 'from-emerald-500 to-teal-500', onClick: "setStatusFilter(['submitted','done'])" },
  ];
  let html = `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">`;
  for (const c of cards) html += `
    <div class="card card-hover p-4 cursor-pointer flex items-center gap-3.5" onclick="${c.onClick}">
      <div class="w-11 h-11 rounded-xl bg-gradient-to-br ${c.grad} flex items-center justify-center shadow-md shrink-0">${c.icon}</div>
      <div><div class="text-2xl font-bold leading-tight stat-num">${c.val}</div><div class="muted mt-0.5">${c.label}</div></div>
    </div>`;
  html += `</div>`;
  html += `<div class="card p-5 mb-5">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold flex items-center gap-2"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-rose-500 to-red-500 inline-block"></span>🚨 紧急区（7 天内截止）</h3>
      ${urgent.length ? `<button class="btn btn-ghost !py-1.5 !px-3 text-xs" onclick="go('list')">查看全部 →</button>` : ''}
    </div>`;
  if (!urgent.length) html += `<div class="text-center py-10"><div class="text-5xl mb-3">🎉</div><div class="text-slate-500 dark:text-slate-400 font-medium">7 天内没有要交的比赛，安心做作品吧</div><div class="muted mt-1">紧急的比赛会自动出现在这里</div></div>`;
  else html += `<div class="space-y-2">` + urgent.slice(0, 8).map(c => {
    const bar = c.countdown <= 3 ? 'bar-urgent' : 'bar-soon';
    return `
    <div class="flex items-center gap-3.5 p-3 rounded-xl bg-slate-50/80 dark:bg-slate-700/40 ${bar} cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors" onclick="openDetail('${c.id}')">
      <div class="flex-1 min-w-0"><div class="font-medium truncate">${esc(c.name)}</div>
      <div class="muted mt-0.5"><span class="badge ${catColor(c.category)} !px-2 !py-0.5 !text-[10px] mr-1.5">${esc(c.category || '未分类')}</span>临期线 ${fmtDate(c.suggested_deadline)} · 官方 ${fmtDate(c.deadline)}</div></div>
      ${countdownBadge(c)}</div>`; }).join('') + `</div>`;
  html += `</div>`;
  html += `<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="card p-5 col-span-2"><h3 class="font-bold mb-3 flex items-center gap-2"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-indigo-500 to-violet-500 inline-block"></span>未来 12 周到期分布（按临期线）</h3><div id="ovChart" style="height:230px"></div></div>
    <div class="card p-5"><h3 class="font-bold mb-3 flex items-center gap-2"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-amber-500 to-orange-500 inline-block"></span>最近导入</h3><div id="ovImport"></div></div>
  </div>`;
  $('view-overview').innerHTML = html;
  renderOverviewChart();
  renderImportHistory('ovImport');
}
function renderOverviewChart() {
  const el = $('ovChart'); if (!el) return;
  const chart = getChart('ovChart');
  chart.setOption({
    grid: { left: 38, right: 12, top: 15, bottom: 28 },
    xAxis: { type: 'category', data: S.stats.weeks.map((_, i) => `${i * 7 + 1}-${Math.min((i + 1) * 7, 84)}天`), axisLabel: { fontSize: 10, color: '#94a3b8', interval: 1 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 10, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } } },
    series: [{ type: 'bar', data: S.stats.weeks, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#8b5cf6' }, { offset: 1, color: '#6366f1' }] }, borderRadius: [6, 6, 0, 0] }, barWidth: '55%' }],
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${p[0].name}<br><b>${p[0].value}</b> 个比赛到期` },
  });
}

/* ---------- 列表 ---------- */
function renderList() {
  const show = S.comps;
  const sortBtn = (key, label) => `<button class="btn btn-ghost !py-1.5 !px-3 text-xs ${S.sort.key === key ? '!bg-indigo-100 !text-indigo-700 dark:!bg-indigo-900/40 dark:!text-indigo-300' : ''}" onclick="setSort('${key}')">${label} ${S.sort.key === key ? (S.sort.order === 'asc' ? '↑' : '↓') : ''}</button>`;
  const cur = [...S.filter.statuses];
  const activeSet = (s) => cur.length && s.every(v => cur.includes(v)) && cur.every(v => s.includes(v));
  const tabBtn = (label, statuses, emoji) => `<button class="btn !py-1.5 !px-3 text-xs ${activeSet(statuses) ? '!bg-gradient-to-r !from-indigo-500 !to-violet-500 !text-white shadow-md shadow-indigo-500/25' : 'btn-ghost'}" data-s='${JSON.stringify(statuses)}' onclick="setStatusFilter(JSON.parse(this.dataset.s))">${emoji} ${label}</button>`;
  let html = `<div class="flex items-center gap-2 mb-4 anim-in flex-wrap">
    <h3 class="font-bold text-lg flex items-center gap-2"><span class="w-1.5 h-5 rounded-full bg-gradient-to-b from-indigo-500 to-violet-500 inline-block"></span>全部比赛 <span class="muted font-normal">${show.length} 条</span></h3>
    <div class="flex items-center gap-1.5 ml-1 flex-wrap">
      ${tabBtn('全部', [], '🗂')}
      ${tabBtn('进行中', ['submitting', 'open', 'urgent', 'not_started'], '🔥')}
      ${tabBtn('已过期', ['past_suggested', 'overdue'], '⏰')}
    </div>
    <div class="flex-1"></div>
    ${sortBtn('deadline', '截止')} ${sortBtn('name', '名称')} ${sortBtn('created', '添加')}
  </div>`;
  if (cur.length) {
    html += `<div class="flex items-center gap-2 mb-3 px-3.5 py-2 rounded-xl bg-amber-50 dark:bg-amber-900/20 border border-amber-200/70 dark:border-amber-700/40 text-sm">
      <span>🔍 当前筛选：<b>${cur.map(s => statusBadge({ status: s })).join(' ')}</b>，共显示 ${show.length} 条（其他状态的比赛被隐藏）</span>
      <button class="btn btn-ghost !py-1 !px-2.5 text-xs ml-auto" onclick="setStatusFilter([])">✕ 清除筛选，显示全部</button>
    </div>`;
  }
  if (!show.length) {
    html += `<div class="card p-12 text-center">
      <div class="text-6xl mb-4">🗓️</div>
      <div class="text-slate-500 dark:text-slate-300 font-medium text-lg mb-1">还没有比赛</div>
      <div class="muted mb-6">点右上角「＋ 添加」，或让 Agent 把 JSON 丢进 data/import/，或到「导入」页粘贴</div>
      <button class="btn btn-primary" onclick="openForm()">＋ 添加第一个比赛</button></div>`;
    $('view-list').innerHTML = html; return;
  }
  html += `<div class="card overflow-x-auto"><table class="w-full min-w-[900px]"><thead class="bg-slate-50/80 dark:bg-slate-700/30"><tr>
    <th>名称</th><th>类别</th><th>临期线</th><th>官方截止</th><th>倒计时</th><th>状态</th><th class="text-right">操作</th></tr></thead><tbody>`;
  for (const c of show) {
    const bar = c.status === 'submitted' || c.status === 'done' || c.status === 'abandoned' ? 'bar-done' : c.countdown <= 7 ? 'bar-urgent' : c.countdown <= 30 ? 'bar-soon' : 'bar-calm';
    html += `<tr class="tr-row border-t border-slate-100/80 dark:border-slate-700/50 ${bar} cursor-pointer" onclick="openDetail('${c.id}')">
      <td class="max-w-[300px]"><div class="font-medium truncate" title="${esc(c.name)}">${esc(c.name)}</div>
        ${c.milestones?.length ? `<div class="muted truncate mt-0.5">⛳ ${esc(c.milestones.map(m => m.name).join('、'))}</div>` : ''}</td>
      <td><span class="badge ${catColor(c.category)} !text-[11px]">${esc(c.category || '未分类')}</span></td>
      <td><span class="font-semibold">${fmtDate(c.suggested_deadline)}</span>${c.suggested_deadline !== c.deadline ? `<div class="muted mt-0.5">官方 ${fmtDate(c.deadline)}</div>` : ''}</td>
      <td class="muted">${fmtDate(c.deadline)}</td>
      <td>${countdownBadge(c)}</td>
      <td>${statusBadge(c)}</td>
      <td class="text-right whitespace-nowrap">
        <button class="btn btn-ghost !py-1 !px-2.5 text-xs" onclick="event.stopPropagation();openDetail('${c.id}')">详情</button>
        <button class="btn btn-ghost !py-1 !px-2.5 text-xs" onclick="event.stopPropagation();openForm('${c.id}')">编辑</button>
      </td></tr>`;
  }
  html += `</tbody></table></div>`;
  $('view-list').innerHTML = html;
}
function setSort(key) {
  if (S.sort.key === key) S.sort.order = S.sort.order === 'asc' ? 'desc' : 'asc';
  else { S.sort.key = key; S.sort.order = 'asc'; }
  refresh();
}
function setStatusFilter(s) {
  S.filter.statuses = Array.isArray(s) ? s : [s];
  go('list'); refresh();
}

/* ---------- 时间线（甘特） ---------- */
function renderTimeline() {
  const ENDED = ['overdue', 'submitted', 'done', 'abandoned'];
  const ts = (s) => Date.parse(s);
  const day = 864e5;
  // 排序：进行中的在前（按临期线），已结束的排后面
  const rows = S.comps.slice().sort((a, b) => {
    const ae = ENDED.includes(a.status) ? 1 : 0, be = ENDED.includes(b.status) ? 1 : 0;
    if (ae !== be) return ae - be;
    return a.suggested_deadline < b.suggested_deadline ? -1 : 1;
  });
  const today = S.stats.today;
  // 滑动窗口：始终显示 今天-3天 → 今天+1个月（自然月），时间推进窗口自动跟随
  const minDate = ts(today) - 3 * day;
  const wd = new Date(today);
  const maxD = new Date(wd.getFullYear(), wd.getMonth() + 1, wd.getDate());
  const maxDate = ts(`${maxD.getFullYear()}-${String(maxD.getMonth() + 1).padStart(2, '0')}-${String(maxD.getDate()).padStart(2, '0')}`);
  // 只显示与窗口有交集的比赛（窗口外的自动隐藏，随日期滑动进出）
  const visible = rows.filter(c => ts(c.deadline) >= minDate - day && ts(c.suggested_deadline) <= maxDate + day);
  const laterCount = rows.length - visible.length;
  const endedCount = visible.filter(c => ENDED.includes(c.status)).length;
  const isMobile = window.innerWidth < 768;
  const rowH = isMobile ? 30 : 34;
  const height = Math.max(460, Math.max(visible.length, 1) * rowH + 100);
  const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };

    <div class="card p-5 anim-in">
      <div class="flex items-center gap-2 mb-1">

        <div class="flex-1"></div>
        <span class="muted text-xs">窗口内 ${visible.length} 个比赛${laterCount ? ` · ${laterCount} 个更晚（窗口外）` : ''}${endedCount ? ` · ${endedCount} 个已结束（灰色）` : ''}</span>
      </div>
      <div class="muted mb-2 text-xs">📅 滑动窗口：${fmt(minDate)} → ${fmt(maxDate)}（今天-3天 至 今天+1个月，随日期自动滑动）</div>
      ${visible.length === 0 ? `<div class="mb-3 px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-700/30 text-sm text-slate-500 dark:text-slate-300">窗口内暂无比赛。${laterCount ? `${laterCount} 个比赛在窗口之后，时间到了会自动出现。` : '可以到「列表」页查看全部比赛。'}</div>` : ''}
      <div class="muted mb-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
        <span><span class="inline-block w-3 h-2 rounded-sm bg-indigo-400/80 align-middle mr-1"></span>准备期</span>
        <span><span class="inline-block w-3 h-2 rounded-sm bg-indigo-600/90 align-middle mr-1"></span>提交期</span>
        <span class="text-rose-500 font-bold">▼</span>临期线 <span class="text-rose-500">(数字)</span>
        <span class="font-bold text-slate-600 dark:text-slate-300">◆</span>官方截止 <span class="text-slate-400">(数字)</span>
        <span class="text-amber-500">●</span>里程碑
        <span class="text-rose-500">┆</span>今天
        <span class="text-slate-400">▦灰</span>已截止/已结束
        <span class="text-slate-400">${isMobile ? '👆 点击行看详情 · 下方滑条缩放/移动' : '💡 顶部 = 窗口日期尺 · 悬停看详情 · 滚轮上下翻页 · 下方滑条缩放 · 点击行打开详情'}</span>
      </div>
      <div id="ganttChart" style="height:${height}px"></div>
    </div>
    <div class="card p-5 anim-in mt-4">
      <div class="flex items-center gap-3 mb-4">
        <h3 class="font-bold flex items-center gap-2"><span class="w-1.5 h-4 rounded-full bg-gradient-to-b from-indigo-500 to-violet-500 inline-block"></span>📊 图表分析</h3>
        <div class="flex-1"></div>
        <label class="muted">到期统计口径</label>
        <select id="dueMode" class="input w-40 !py-2" onchange="renderDueChart()"><option value="suggested">临期线</option><option value="official">官方截止</option></select>
      </div>
      <div class="tl-grid-2">
        <div class="bg-slate-50/60 dark:bg-slate-700/20 rounded-2xl p-4"><h4 class="font-bold text-sm mb-3 flex items-center gap-2">⏳ 倒计时排行</h4><div id="cdChart" style="height:320px"></div></div>
        <div class="bg-slate-50/60 dark:bg-slate-700/20 rounded-2xl p-4"><h4 class="font-bold text-sm mb-3 flex items-center gap-2">📊 到期分布（按周）</h4><div id="dueChart" style="height:320px"></div></div>
      </div>
      <div class="tl-grid-2 mt-4">
        <div class="bg-slate-50/60 dark:bg-slate-700/20 rounded-2xl p-4"><h4 class="font-bold text-sm mb-3 flex items-center gap-2">🧩 类别占比</h4><div id="catChart" style="height:280px"></div></div>
        <div class="bg-slate-50/60 dark:bg-slate-700/20 rounded-2xl p-4"><h4 class="font-bold text-sm mb-3 flex items-center gap-2">📅 未来 5 周到期数（按临期线）</h4><div id="monChart" style="height:280px"></div></div>
      </div>
    </div>`;
  const el = $('ganttChart'); if (!el) return;
  const chart = getChart('ganttChart');
  renderCountdownChart(); renderDueChart(); renderCategoryChart(); renderMonthChart();
  chart.setOption({
    grid: { left: isMobile ? 100 : (window.innerWidth < 1150 ? 150 : 235), right: isMobile ? 55 : 100, top: isMobile ? 24 : 44, bottom: isMobile ? 40 : 50 },
    axisPointer: { link: [{ xAxisIndex: [0] }], label: { backgroundColor: '#6366f1' } },
    tooltip: {
      trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.92)', textStyle: { color: '#fff', fontSize: 12 },
      borderWidth: 0, axisPointer: { type: 'cross', label: { backgroundColor: '#6366f1' } },
      formatter: (ps) => {
        for (const p of ps) {
          if (p.seriesType !== 'custom') continue;
          const c = visible[p.dataIndex];
          const ms = (c.milestone_countdowns || []).map(m => `${m.name} ${fmtFull(ts(m.date))}`).join('<br>');
          return `<b>${esc(c.name)}</b> <span style="color:#94a3b8">${c.status_label || ''}</span><br>

            ${c.signup_start ? `报名：${fmtFull(ts(c.signup_start))} → ${fmtFull(ts(c.signup_end || c.signup_start))}<br>` : ''}

      },
    },
    xAxis: [

        // 主轴：刻度加密（每周），随滑条缩放

          formatter: (v) => { const d = new Date(v); return `${d.getMonth() + 1}/${d.getDate()}`; },
        },

      },
      {

        show: !isMobile,
        type: 'time', position: 'top', min: minDate, max: maxDate,
        axisLabel: {
          fontSize: 10, color: '#94a3b8', hideOverlap: false,
          formatter: (v) => { const d = new Date(v); return `${d.getMonth() + 1}月`; },
        },
        axisLine: { show: false }, axisTick: { show: false },
        splitLine: { show: false }, axisPointer: { show: false },
        minInterval: 14 * day,
      },
    ],
    yAxis: {
      type: 'category',
      data: visible.map(c => c.name + (ENDED.includes(c.status) ? '（已截止）' : '')),
      axisLabel: {
        fontSize: isMobile ? 10 : 11, width: isMobile ? 92 : 210, overflow: 'truncate',
        color: (v, i) => (visible[i] && ENDED.includes(visible[i].status)) ? '#94a3b8' : '#475569',
      },
    },
    series: [{
      type: 'custom', renderItem: (params, api) => {
        const idx = api.value(0); const c = visible[idx];
        const y = api.coord([0, idx])[1];
        const barH = 15;
        const ended = ENDED.includes(c.status);
        const done = c.status === 'submitted' || c.status === 'done';
        const parts = [];
        const X = (t) => api.coord([t, 0])[0];
        /* 绘图区左右边界：所有条形段钳制在此范围内，防止画出图表之外 */
        const plotL = X(minDate), plotR = X(maxDate);
        const rect = (x0, x1, fill, h = barH) => {
          if (!isFinite(x0) || !isFinite(x1)) return;
          x0 = Math.max(x0, plotL); x1 = Math.min(x1, plotR);
          if (x1 - x0 < 0.5) return;  /* 完全在绘图区外（或宽度不足）不绘制 */
          parts.push({ type: 'rect', shape: { x: x0, y: y - h / 2, width: x1 - x0, height: h }, style: { fill, opacity: 0.9 } });
        };
        const sd = ts(c.suggested_deadline), dl = ts(c.deadline);
        const mainCol = done ? 'rgba(16,185,129,0.85)' : ended ? 'rgba(148,163,184,0.55)' : 'rgba(99,102,241,0.88)';
        const prepCol = done ? 'rgba(16,185,129,0.35)' : ended ? 'rgba(148,163,184,0.3)' : 'rgba(129,140,248,0.4)';
        // 准备段：有报名期用报名期，否则临期线前推 14 天（让条足够宽、可读）
        const prepStart = (c.signup_start && c.signup_end) ? ts(c.signup_start) : sd - 14 * day;
        rect(X(prepStart), X(sd), prepCol);
        // 提交段：临期线 → 官方截止
        rect(X(sd), X(dl), mainCol);
        // 临期线红旗 + 日期小字
        const sx = X(sd);
        parts.push({ type: 'path', shape: { path: 'M0,-6 L6,0 L0,6 L-6,0 Z', x: sx - 6, y: y - 6 }, style: { fill: ended ? '#94a3b8' : '#f43f5e' } });
        parts.push({ type: 'text', style: { text: fmt(sd), x: sx, y: y - barH / 2 - 5, fill: ended ? '#94a3b8' : '#f43f5e', fontSize: 9, align: 'center' } });
        // 官方截止方块 + 日期小字
        const dx = X(dl);
        parts.push({ type: 'rect', shape: { x: dx - 4, y: y - 8, width: 8, height: 16 }, style: { fill: '#334155' } });
        parts.push({ type: 'text', style: { text: fmt(dl), x: dx + 7, y: y - 5, fill: '#64748b', fontSize: 9, align: 'left' } });
        // 里程碑圆点
        for (const ms of c.milestone_countdowns || []) {
          const mx = X(ts(ms.date));
          parts.push({ type: 'circle', shape: { cx: mx, cy: y, r: 3.5 }, style: { fill: '#f59e0b', stroke: '#fff', lineWidth: 1 } });
        }
        return { type: 'group', children: parts };
      },
      encode: { x: [1, 2], y: 0 },
      clip: true,
      data: visible.map((c, i) => [i, ts(c.deadline), ts(c.suggested_deadline), c]),
      // 今天线（必须放在 series 内部才生效）
      markLine: {
        silent: true, symbol: 'none',
        lineStyle: { color: '#f43f5e', width: 1.5, type: 'dashed' },
        label: { show: true, formatter: '今天', position: 'insideEndTop', fontSize: 10, color: '#f43f5e' },
        data: [{ xAxis: ts(today) }],
      },
    }],
    dataZoom: [
      // 注意：不用 inside 滚轮缩放——滚轮固定用于页面上下翻页，缩放/平移全部由底部滑条完成
      // filterMode: 'none' 关键！只缩放视图不过滤数据（custom 图表的数据由 renderItem 按当前轴范围计算位置）
      { type: 'slider', xAxisIndex: [0], filterMode: 'none', height: isMobile ? 16 : 18, bottom: isMobile ? 6 : 8, start: 0, end: 100,
        minSpan: 3 * day, showDetail: true,
        borderColor: 'transparent', backgroundColor: 'rgba(148,163,184,0.15)',
        fillerColor: 'rgba(99,102,241,0.15)', handleStyle: { color: '#818cf8' },
        textStyle: { color: '#94a3b8', fontSize: isMobile ? 9 : 10 } },
      // 手机端：图表区域直接手指左右拖动平移（触摸手势；鼠标滚轮/拖动全部禁用，不影响桌面翻页）
      ...(isMobile ? [{ type: 'inside', xAxisIndex: [0], filterMode: 'none',
        zoomOnMouseWheel: false, moveOnMouseWheel: false, moveOnMouseMove: false,
        start: 0, end: 100, minSpan: 3 * day }] : []),
    ],
  });
  chart.on('click', p => { if (p.dataIndex != null) openDetail(visible[p.dataIndex].id); });
}

function renderCharts() {
  $('view-charts').innerHTML = `
    <div class="flex items-center gap-3 mb-4 anim-in"><h3 class="font-bold text-lg flex items-center gap-2"><span class="w-1.5 h-5 rounded-full bg-gradient-to-b from-indigo-500 to-violet-500 inline-block"></span>图表分析</h3><div class="flex-1"></div>

      <div class="card p-5"><h4 class="font-bold text-sm mb-3 flex items-center gap-2">📊 到期分布（按周）</h4><div id="dueChart" style="height:380px"></div></div>

    </div>`;

function renderCountdownChart() {
  const active = S.comps.filter(c => !['submitted', 'done', 'abandoned', 'overdue'].includes(c.status));
  const rows = active.slice().sort((a, b) => a.countdown - b.countdown).slice(0, 15);
  const chart = getChart('cdChart');
  chart.setOption({
    grid: { left: 10, right: 64, top: 10, bottom: 10, containLabel: true },
    xAxis: { type: 'value', minInterval: 1, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
    yAxis: { type: 'category', data: rows.map(c => c.name), axisLabel: { fontSize: 11, width: 150, overflow: 'truncate', color: '#475569' } },
    series: [{
      type: 'bar', data: rows.map(c => ({
        value: c.countdown,
        itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: c.countdown <= 3 ? [{ offset: 0, color: '#e11d48' }, { offset: 1, color: '#f43f5e' }] : c.countdown <= 7 ? [{ offset: 0, color: '#f43f5e' }, { offset: 1, color: '#fb7185' }] : c.countdown <= 30 ? [{ offset: 0, color: '#f59e0b' }, { offset: 1, color: '#fbbf24' }] : [{ offset: 0, color: '#10b981' }, { offset: 1, color: '#34d399' }] }, borderRadius: [0, 8, 8, 0] },
      })), label: { show: true, position: 'right', formatter: p => `剩 ${p.value} 天`, fontSize: 11, color: '#64748b', fontWeight: 600 }, barWidth: 14,
    }],
    tooltip: { backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${esc(rows[p.dataIndex].name)}<br>剩 <b>${p.value}</b> 天<br>临期线 ${rows[p.dataIndex].suggested_deadline}` },
  });
  chart.on('click', p => { if (p.dataIndex != null) openDetail(rows[p.dataIndex].id); });
}
function renderDueChart() {
  const mode = $('dueMode')?.value || 'suggested';
  const chart = getChart('dueChart');
  const counts = {};
  for (const c of S.comps) {
    if (['submitted', 'done', 'abandoned'].includes(c.status)) continue;
    const d = mode === 'suggested' ? c.suggested_deadline : c.deadline;
    const days = Math.floor((Date.parse(d) - Date.parse(S.stats.today)) / 864e5);
    if (days < 0) continue;
    const wk = Math.floor(days / 7);
    counts[wk] = (counts[wk] || 0) + 1;
  }
  const weeks = Array.from({ length: 12 }, (_, i) => counts[i] || 0);
  chart.setOption({
    grid: { left: 38, right: 12, top: 15, bottom: 28 },
    xAxis: { type: 'category', data: weeks.map((_, i) => `${i * 7 + 1}-${Math.min((i + 1) * 7, 84)}天`), axisLabel: { fontSize: 10, color: '#94a3b8', interval: 1 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 10, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } } },
    series: [{ type: 'bar', data: weeks, itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: '#f59e0b' }, { offset: 1, color: '#fbbf24' }] }, borderRadius: [6, 6, 0, 0] }, barWidth: '55%' }],
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${p[0].name}<br><b>${p[0].value}</b> 个比赛到期（${mode === 'suggested' ? '临期线' : '官方截止'}）` },
  });
}
function renderCategoryChart() {
  const chart = getChart('catChart');
  const cats = Object.entries(S.stats.by_category).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  chart.setOption({
    color: ['#8b5cf6', '#f43f5e', '#10b981', '#f59e0b', '#0ea5e9', '#a78bfa', '#94a3b8'],
    series: [{ type: 'pie', radius: ['48%', '72%'], data: cats, label: { fontSize: 11, formatter: '{b}\n{c} 个', color: '#64748b' }, emphasis: { scaleSize: 6, itemStyle: { shadowBlur: 16, shadowColor: 'rgba(0,0,0,0.12)' } }, itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 } }],
    tooltip: { trigger: 'item', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: p => `${esc(p.name)}：<b>${p.value}</b> 个（${p.percent}%）` },
  });
  chart.on('click', p => { S.filter.cats = [p.name]; S.filter.statuses = []; go('list'); refresh(); });
}
function renderMonthChart() {
  // 未来 5 周到期数（按临期线，排除已结束）
  const chart = getChart('monChart');
  const today = S.stats.today;
  const day = 864e5;
  const ts = (s) => Date.parse(s);
  const weeks = [];
  for (let w = 0; w < 5; w++) {
    const start = ts(today) + w * 7 * day;
    const d = new Date(start);
    weeks.push({ start, end: start + 7 * day, name: `${d.getMonth() + 1}/${d.getDate()}`, value: 0 });
  }
  const active = S.comps.filter(c => !['submitted', 'done', 'abandoned', 'overdue'].includes(c.status));
  for (const c of active) {
    const t = ts(c.suggested_deadline || c.deadline);
    for (const wk of weeks) {
      if (t >= wk.start && t < wk.end) { wk.value++; break; }
    }
  }
  chart.setOption({
    grid: { left: 38, right: 12, top: 18, bottom: 28 },
    xAxis: { type: 'category', data: weeks.map(w => w.name), axisLabel: { color: '#94a3b8', fontSize: 10 }, axisLine: { lineStyle: { color: '#e2e8f0' } }, axisTick: { show: false } },
    yAxis: { type: 'value', minInterval: 1, axisLabel: { fontSize: 10, color: '#94a3b8' }, splitLine: { lineStyle: { color: '#f1f5f9', type: 'dashed' } } },
    series: [{ type: 'line', data: weeks.map(w => w.value), smooth: true, symbolSize: 9, lineStyle: { color: '#8b5cf6', width: 3 }, itemStyle: { color: '#8b5cf6', borderColor: '#fff', borderWidth: 2 }, areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: 'rgba(139,92,246,0.28)' }, { offset: 1, color: 'rgba(139,92,246,0.02)' }] } } }],
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(15,23,42,0.9)', textStyle: { color: '#fff', fontSize: 12 }, borderWidth: 0, formatter: (p) => {
      const wk = weeks[p[0].dataIndex];
      const d0 = new Date(wk.start), d1 = new Date(wk.end - day);
      return `${d0.getMonth() + 1}/${d0.getDate()} - ${d1.getMonth() + 1}/${d1.getDate()}<br><b>${wk.value}</b> 个比赛到期`;
    } },
  });
}

async function refreshAwards() {
  const q = new URLSearchParams();
  if (S_AWARDS.filter.keyword) q.set('keyword', S_AWARDS.filter.keyword);
  if (S_AWARDS.filter.level) q.append('level', S_AWARDS.filter.level);
  if (S_AWARDS.filter.first) q.set('first', 'true');
  const [list, stats] = await Promise.all([api('/api/awards?' + q), api('/api/awards/stats')]);
  S_AWARDS.list = list.awards || []; S_AWARDS.stats = stats;
}

    <select id="awardLevelFilter" class="input !w-32 !py-2 !rounded-full !text-xs shrink-0">

  const show = S_AWARDS.list;

      <div class="muted mb-6">点右上角「＋ 添加获奖」，把证书拍下来/导出 PDF 上传存档<br>也可以让 Agent 用 ` + '`' + `WorkCalendar-cli.exe --import-awards x.json` + '`' + ` 批量导入</div>

  }
  // 按比赛分组：同系列比赛只显示一次组标题，避免重复（2026-08-11）

      <div class="px-4 py-2.5 bg-slate-50/80 dark:bg-slate-700/30 border-b border-slate-200/60 dark:border-slate-700/50 flex items-center gap-2 flex-wrap">

        <span class="badge bg-indigo-50 text-indigo-600 dark:bg-indigo-900/40 dark:text-indigo-300">${items.length} 条</span>

      </div>
      <table class="w-full min-w-[860px]"><thead class="bg-slate-50/80 dark:bg-slate-700/30"><tr>

      const certs = (a.certificate_files || []).length;
      html += `<tr class="tr-row border-t border-slate-100/80 dark:border-slate-700/50 cursor-pointer" onclick="viewAwardDetail('${a.id}')">

        <td>${esc(a.award_rank) || '<span class="muted">—</span>'}</td>

        <td class="muted">${a.award_date ? fmtDate(a.award_date) : '—'}</td>
        <td>${certs ? `<span class="badge bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-300">📎 ${certs} 个</span>` : '<span class="muted">无</span>'}</td>

          <button class="btn btn-ghost !py-1 !px-2.5 text-xs" onclick="event.stopPropagation();viewAwardDetail('${a.id}')">详情</button>

    sb.oninput = debounce(() => { S_AWARDS.filter.keyword = sb.value; refreshAwards().then(renderAwards); }, 300);

  const lf = $('awardLevelFilter'); if (lf) lf.onchange = () => { setAwardFilter('level', lf.value); };

function debounce(fn, ms) { let t = null; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
function setAwardFilter(kind, val) {
  if (kind === 'level') S_AWARDS.filter.level = val;
  else if (kind === 'first') S_AWARDS.filter.first = !!val;
  else if (kind === 'keyword') S_AWARDS.filter.keyword = val;
  refreshAwards().then(renderAwards);
}
let AWARD_CERTS = [];
function openAwardForm(id) {
  S.editingAwardId = id || null;
  $('awardFormTitle').textContent = id ? '✏️ 编辑获奖' : '＋ 添加获奖';
  AWARD_CERTS = [];
  const f = {};
  if (id) { const a = S_AWARDS.list.find(x => x.id === id) || {}; Object.assign(f, a); }
  $('a_name').value = f.name || '';
  $('a_level').value = f.level || '校级';
  $('a_rank').value = f.award_rank || '';
  $('a_date').value = f.award_date || '';
  $('a_competition').value = f.competition || '';
  $('a_role').value = f.role || (f.is_first_author ? '一作' : '');
  $('a_first').checked = !!f.is_first_author;
  $('a_notes').value = f.notes || '';
  AWARD_CERTS = [...(f.certificate_files || [])];
  renderCertList();
  // 关联比赛下拉
  const dl = $('compList'); if (dl) dl.innerHTML = S.comps.map(c => `<option value="${esc(c.name)}">`).join('');
  $('awardModal').classList.remove('hidden');
}
function closeAwardForm() { $('awardModal').classList.add('hidden'); S.editingAwardId = null; AWARD_CERTS = []; }
function renderCertList() {
  const el = $('a_certs'); if (!el) return;
  if (!AWARD_CERTS.length) { el.innerHTML = '<span class="muted text-xs">未上传凭证</span>'; return; }
  el.innerHTML = AWARD_CERTS.map((f, i) => `
    <span class="badge bg-emerald-50 text-emerald-600 border border-emerald-200/60 dark:bg-emerald-900/30 dark:text-emerald-300 dark:border-emerald-700 !py-1.5 gap-1">
      <a href="${IS_LOCAL ? 'javascript:void(0)' : '/certificates/' + encodeURIComponent(f)}" target="_blank" rel="noopener" class="underline">📎 ${esc(f)}</a>
      <button class="hover:text-rose-500" onclick="removeCert(${i})" title="移除">✕</button>
    </span>`).join('');
}
async function renderCertsInto(el, certs) {
  if (!el) return;
  certs = certs || [];
  if (!certs.length) { el.innerHTML = '<span class="muted">未上传凭证</span>'; return; }
  if (!IS_LOCAL) {
    el.innerHTML = certs.map(f => /\.(jpe?g|png|webp|gif)$/i.test(f)
      ? `<div class="rounded-xl overflow-hidden border border-slate-200 dark:border-slate-600"><img src="/certificates/${encodeURIComponent(f)}" class="w-full h-auto cursor-pointer" onclick="window.open('/certificates/${encodeURIComponent(f)}','_blank')" title="点击放大"></div>`
      : `<a class="btn btn-ghost !py-1.5 !px-3 text-xs" href="/certificates/${encodeURIComponent(f)}" target="_blank" rel="noopener">📄 ${esc(f)}</a>`).join('');
    return;
  }
  el.innerHTML = '<span class="muted text-xs">加载凭证…</span>';
  const parts = [];
  for (const f of certs) {
    const url = await certUrl(f);
    if (!url) { parts.push(`<div class="muted text-xs">📄 ${esc(f)}（凭证在电脑上，同步后可见）</div>`); continue; }
    if (/\.(jpe?g|png|webp|gif)$/i.test(f)) parts.push(`<img src="${url}" class="w-full h-auto rounded-xl border border-slate-200 dark:border-slate-600">`);
    else parts.push(`<a class="btn btn-ghost !py-1.5 !px-3 text-xs" href="${url}" target="_blank" rel="noopener">📄 ${esc(f)}</a>`);
  }
  el.innerHTML = parts.join('');
}
function pickCert() { $('certFile').click(); }
async function uploadCert(input) {
  const f = input.files[0]; if (!f) return;
  if (f.size > 50 * 1024 * 1024) { toast('文件过大（上限 50MB）', 'err'); input.value = ''; return; }
  const buf = await f.arrayBuffer();
  const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
  try {
    const r = await api('/api/certificates', { method: 'POST', body: { name: f.name, data: b64 } });
    AWARD_CERTS.push(r.filename);
    renderCertList();
    toast('凭证已上传：' + r.filename);
  } catch (e) { toast('上传失败：' + e.message, 'err'); }
  input.value = '';
}
function removeCert(i) { AWARD_CERTS.splice(i, 1); renderCertList(); }
async function submitAwardForm() {
  const name = $('a_name').value.trim();
  if (!name) return toast('奖项名称是必填项', 'warn');
  const body = {
    name, level: $('a_level').value, award_rank: $('a_rank').value.trim(),
    award_date: $('a_date').value || null, competition: $('a_competition').value.trim(),
    role: $('a_role').value, is_first_author: $('a_first').checked,
    certificate_files: AWARD_CERTS, notes: $('a_notes').value,
  };
  try {
    if (S.editingAwardId) await api('/api/awards/' + S.editingAwardId, { method: 'PUT', body });
    else await api('/api/awards', { method: 'POST', body });
    toast(S.editingAwardId ? '已保存 🏆' : '已添加获奖 🎉');
    closeAwardForm(); refreshAwards().then(renderAwards);
  } catch (e) { toast('保存失败：' + e.message, 'err'); }
}

async function delAward(id) {
  if (!confirm('确定删除这条获奖记录？删除前会自动备份。')) return;
  await api('/api/awards/' + id, { method: 'DELETE' });
  toast('已删除'); closeDrawer(); refreshAwards().then(renderAwards);
}

async function doImportText() {
  const text = $('impText').value.trim();
  if (!text) return toast('请先粘贴内容', 'warn');
  try {
    const r = await api('/api/import', { method: 'POST', body: { text } });
    showImportReport(r.report); pushImportHistory(r.report);
    $('impText').value = ''; refresh();
  } catch (e) { toast('导入失败：' + e.message, 'err'); }
}
async function doImportFile(input) {
  const f = input.files[0]; if (!f) return;
  const text = await f.text();
  try {
    const r = await api('/api/import', { method: 'POST', body: { text } });
    showImportReport(r.report); pushImportHistory(r.report);
    refresh();
  } catch (e) { toast('导入失败：' + e.message, 'err'); }
  input.value = '';
}
function pushImportHistory(report) {
  S.importHistory.unshift({ time: new Date().toLocaleString(), report });
  S.importHistory = S.importHistory.slice(0, 20);

async function aiSend() {
  if (S.ai.busy) return;
  const input = $('aiInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const attach = S.ai.attach.slice();
  const images = attach.filter(a => a.kind === 'image').map(a => a.dataUrl);
  const tables = attach.filter(a => a.kind === 'table');
  let fullText = text;
  for (const t of tables) fullText += `

【附件文件 ${t.name} 的内容】
${t.text}`;
  S.ai.messages.push({ role: 'user', content: fullText, images, tables: tables.map(t => t.name) });
  S.ai.attach = [];
  aiRenderAttach();
  S.ai.busy = true;
  renderAiMsgs();
  try {
    const toSend = S.ai.messages.slice(-20).map(m => {
      if (m.role === 'user' && m.images?.length) {
        return { role: 'user', content: [{ type: 'text', text: m.content || '请识别这张图片' },
          ...m.images.map(u => ({ type: 'image_url', image_url: { url: u } }))] };
      }
      return { role: m.role, content: m.content };
    });
    let r = null;
    try {
      /* 异步任务 + 轮询：实时轮播 AI 工作状态 */
      const j = await api('/api/ai_chat_async', { method: 'POST', body: { messages: toSend } });
      if (j.job_id) {
        const t0 = Date.now();
        let timeoutHit = false;
        for (;;) {
          await new Promise(res => setTimeout(res, 700));
          const sec = Math.round((Date.now() - t0) / 1000);
          if (sec > 600) { timeoutHit = true; break; }  /* 150s 兜底：后台可能仍在跑 */
          const st = await api('/api/ai_status?id=' + encodeURIComponent(j.job_id));
          if (!st.running) {
            /* 完成后结果平铺在响应顶层：ok / reply / trace / error */
            r = { ok: !!st.ok, reply: st.reply, trace: st.trace, error: st.error };
            if (!r.ok && !r.error) r = { ok: false, error: '任务结束但无结果' };
            break;
          }
          aiSetBusy((st.status || '处理中…') + ' · ' + sec + 's');
        }
        if (timeoutHit && !r) {
          S.ai.messages.push({ role: 'assistant', content: '⏳ 联网搜索耗时较长，仍在后台处理中。'
            + '请先检查数据变化，避免重复提交同一录入请求。' });
        }
        if (timeoutHit && !r) r = { skipped: true };
      }
    } catch (e) {
      if (!/404|未知路径|ai_chat_async/.test(e.message)) throw e;  /* 旧版 exe 回退同步 */
    }
    if (!r) r = await api('/api/ai_chat', { method: 'POST', body: { messages: toSend } });
    if (r.ok) S.ai.messages.push({ role: 'assistant', content: r.reply, trace: r.trace });
    /* 识别建档后：把本次上传的图片自动存为该获奖记录的凭证 */
    const awardTrace = (r.trace || []).find(t => t.tool === 'add_award' && t.result_id);
    if (awardTrace && images.length) {
      const saved = await aiAttachCerts(awardTrace.result_id, images);
      if (saved.length) toast('证书图片已存为凭证：' + saved.join('、'));
    }
    else {
      const raw = r.raw ? ('原始响应: ' + String(r.raw).slice(0, 180)) : '';
      S.ai.messages.push({ role: 'assistant', content: '⚠️ ' + (r.error || '未知错误') + (raw ? '\n🔍 ' + raw : '') });
    }
      reportClientError('AI 任务失败: ' + (r.error || '未知错误') + ' | ' + (r.raw || ''));
    if (r.trace?.some(t => ['add_competition', 'update_competition', 'delete_competition'].includes(t.tool))) refresh();
  } catch (e) {
    S.ai.messages.push({ role: 'assistant', content: '⚠️ ' + e.message });
    reportClientError('AI 发送失败: ' + e.message, e.stack);
  } finally {
    S.ai.busy = false;
    renderAiMsgs();
    try { localStorage.setItem('wc_ai_chat', JSON.stringify(S.ai.messages.slice(-50).map(m => ({ role: m.role, content: m.content, trace: m.trace, tables: m.tables })))); } catch (e) {}
  }
}
async function openExportFolder() {
  try { const r = await api('/api/open_folder', { method: 'POST', body: { target: 'exports' } }); toast('已打开：' + r.path); }
  catch (e) { toast('打开失败：' + e.message, 'err'); }
}
async function openLogsFolder() {
  try { const r = await api('/api/open_folder', { method: 'POST', body: { target: 'logs' } }); toast('已打开：' + r.path); }
  catch (e) { toast('打开失败：' + e.message, 'err'); }
}
async function exportLogsZip() {
  try {
    const r = await api('/api/export_logs', { method: 'POST' });
    toast('日志已导出：' + r.path);
    const bi = $('backupInfo'); if (bi) bi.textContent = '日志已导出：' + r.path;
  } catch (e) { toast('导出失败：' + e.message, 'err'); }

function toggleTheme() {
  S.dark = !S.dark;
  document.documentElement.classList.toggle('dark', S.dark);
  const sun = $('themeSun'), moon = $('themeMoon');
  if (sun && moon) { sun.classList.toggle('hidden', !S.dark); moon.classList.toggle('hidden', S.dark); }
  localStorage.setItem('ds_theme', S.dark ? 'dark' : 'light');
  try { applyWallpaper(); } catch (e) {}  // 深浅色下壁纸淡色不同，重新套色
  render();  // 重建图表配色
}

/* ---------- 详情抽屉 ---------- */
async function openDetail(id) {
  // 优先用列表已缓存数据（省一次请求）；不在列表（被筛选掉）时再拉取
  let c = S.comps.find(x => x.id === id);
  if (!c) c = (await api('/api/competitions/' + id)).competition;
  const ms = (c.milestone_countdowns || []).map(m => {
    const cls = m.days < 0 ? 'text-slate-400' : m.days <= 3 ? 'text-rose-600 font-bold' : m.days <= 7 ? 'text-amber-600 dark:text-amber-400' : 'text-slate-600 dark:text-slate-300';
    return `<div class="flex items-center justify-between py-2 border-b border-slate-100 dark:border-slate-700 last:border-0">
      <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>${esc(m.name)}<span class="muted">${m.date}</span></span>
      <span class="${cls}">${m.days < 0 ? '已过 ' + (-m.days) + ' 天' : '剩 ' + m.days + ' 天'}</span></div>`;
  }).join('') || '<div class="muted py-2">无</div>';
  const sub = c.submission || {};
  const fmt = c.format || {};
  const del = (c.deliverables || []).map(d => `<li class="flex gap-2"><span class="text-indigo-400">▸</span><span>${esc(d)}</span></li>`).join('');
  $('drawerPanel').innerHTML = `
    <div class="h-24 bg-gradient-to-r from-indigo-500 via-violet-500 to-purple-500 relative px-6 pt-5 pb-4">
      <div class="absolute right-4 top-4"><button class="w-8 h-8 rounded-full bg-white/20 text-white hover:bg-white/30 backdrop-blur flex items-center justify-center text-sm transition-colors" onclick="closeDrawer()">✕</button></div>
      <div class="text-white/70 text-xs mb-1">${esc(c.category || '未分类')}${c.organizer ? ' · ' + esc(c.organizer) : ''}</div>
      <h2 class="text-xl font-bold text-white leading-snug pr-8">${esc(c.name)}</h2>
      <div class="flex gap-2 mt-2.5">${statusBadge(c)} ${countdownBadge(c)}</div>
    </div>
    <div class="p-6">
    ${safeUrl(c.website) ? `<a class="text-indigo-600 dark:text-indigo-400 text-sm underline hover:text-indigo-700" href="${esc(safeUrl(c.website))}" target="_blank" rel="noopener">🔗 官网入口 →</a>` : ''}
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div class="rounded-2xl bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-800 p-4">
        <div class="muted mb-1">⏰ 临期线（要赶的）</div>
        <div class="text-xl font-bold text-rose-600 dark:text-rose-400">${c.suggested_deadline}</div>
        ${c.suggested_deadline !== c.deadline ? '<div class="muted text-[11px] mt-1">官方截止前预留缓冲</div>' : ''}</div>
      <div class="rounded-2xl bg-slate-50 dark:bg-slate-700/40 border border-slate-100 dark:border-slate-600 p-4">
        <div class="muted mb-1">📌 官方截止</div>
        <div class="text-xl font-bold">${c.deadline}</div>
        ${c.deadline_note ? `<div class="muted text-[11px] mt-1">${esc(c.deadline_note)}</div>` : ''}</div>
    </div>
    ${c.signup_start || c.signup_end ? `<div class="muted mt-2 text-xs">报名：${c.signup_start ? fmtDate(c.signup_start) : '—'} → ${c.signup_end ? fmtDate(c.signup_end) : '—'}</div>` : ''}
    <div class="mt-5"><h4 class="font-bold text-sm mb-1.5 flex items-center gap-2"><span class="w-1 h-3.5 rounded-full bg-amber-400 inline-block"></span>提交链路（里程碑）</h4>${ms}</div>
    <div class="mt-5"><h4 class="font-bold text-sm mb-1.5 flex items-center gap-2"><span class="w-1 h-3.5 rounded-full bg-indigo-500 inline-block"></span>作品要求</h4>
      <div class="text-sm whitespace-pre-wrap leading-relaxed">${esc(c.requirements) || '<span class="muted">未填写</span>'}</div>
      ${del ? `<ul class="text-sm space-y-1 mt-2">${del}</ul>` : ''}</div>
    <div class="mt-5"><h4 class="font-bold text-sm mb-1.5 flex items-center gap-2"><span class="w-1 h-3.5 rounded-full bg-emerald-500 inline-block"></span>📮 去哪交</h4>
      <div class="text-sm space-y-1.5 leading-relaxed">
        <div class="flex gap-2"><span class="muted shrink-0">方式</span><span>${esc(sub.method) || '<span class="muted">未填写</span>'}</span></div>
        <div class="flex gap-2 items-start"><span class="muted shrink-0">入口</span><span class="break-all">${sub.target ? `<span class="font-mono text-xs bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">${esc(sub.target)}</span> <button class="btn btn-ghost !py-0.5 !px-2 text-[10px]" onclick="copyText('${esc(sub.target).replace(/'/g, "\\'")}')">复制</button>` : '<span class="muted">未填写</span>'}</span></div>
        ${sub.contact ? `<div class="flex gap-2"><span class="muted shrink-0">联系</span><span>${esc(sub.contact)}</span></div>` : ''}
        ${sub.fee ? `<div class="flex gap-2"><span class="muted shrink-0">费用</span><span>${esc(sub.fee)}</span></div>` : ''}
        ${sub.note ? `<div class="muted">${esc(sub.note)}</div>` : ''}
      </div></div>
    <div class="mt-5"><h4 class="font-bold text-sm mb-1.5 flex items-center gap-2"><span class="w-1 h-3.5 rounded-full bg-sky-500 inline-block"></span>📐 格式</h4>
      <div class="text-sm space-y-1.5">
        <div class="flex gap-2"><span class="muted shrink-0">类型</span><span>${esc((fmt.file_types || []).join(', ')) || '<span class="muted">未填写</span>'}</span></div>
        ${fmt.max_size_mb ? `<div class="flex gap-2"><span class="muted shrink-0">上限</span><span>${fmt.max_size_mb} MB</span></div>` : ''}
        ${fmt.naming ? `<div class="flex gap-2 items-start"><span class="muted shrink-0">命名</span><span class="font-mono text-xs bg-slate-100 dark:bg-slate-700 px-1.5 py-0.5 rounded">${esc(fmt.naming)}</span> <button class="btn btn-ghost !py-0.5 !px-2 text-[10px]" onclick="copyText('${esc(fmt.naming).replace(/'/g, "\\'")}')">复制</button></div>` : ''}
        ${fmt.note ? `<div class="muted">${esc(fmt.note)}</div>` : ''}
      </div></div>
    ${(c.tags || []).length ? `<div class="mt-4 flex gap-1.5 flex-wrap">${c.tags.map(t => `<span class="badge bg-amber-50 text-amber-600 border border-amber-200/60 dark:bg-amber-900/30 dark:text-amber-300 dark:border-amber-700">#${esc(t)}</span>`).join('')}</div>` : ''}
    ${c.notes ? `<div class="mt-3 text-sm"><span class="muted">备注：</span>${esc(c.notes)}</div>` : ''}
    ${c.source_url ? `<div class="muted mt-2 text-xs">来源：<a class="underline" href="${esc(safeUrl(c.source_url))}" target="_blank" rel="noopener">${esc(c.source_url)}</a></div>` : ''}
    <div class="flex flex-wrap gap-2 mt-6 pt-4 border-t border-slate-100 dark:border-slate-700">
      <button class="btn btn-primary" onclick="setOverride('${c.id}','submitted')">✓ 标记已提交</button>
      <button class="btn btn-ghost" onclick="setOverride('${c.id}','done')">🏁 已完成</button>
      <button class="btn btn-ghost" onclick="setOverride('${c.id}','abandoned')">🚫 放弃</button>
      <button class="btn btn-ghost" onclick="openForm('${c.id}')">✏️ 编辑</button>
      <button class="btn btn-danger" onclick="delComp('${c.id}')">🗑 删除</button>
    </div>
    </div>`;
  $('drawer').classList.remove('hidden');
}
function closeDrawer() { $('drawer').classList.add('hidden'); }
function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast('已复制'), () => toast('复制失败', 'err')); }
async function setOverride(id, s) {
  await api('/api/competitions/' + id, { method: 'PUT', body: { status_override: s } });
  toast(s === 'submitted' ? '已标记为已提交 🎉' : s === 'done' ? '已完成 🏁' : '已标记放弃');
  closeDrawer(); refresh();
}
async function delComp(id) {
  if (!confirm('确定删除这条比赛？删除前会自动备份。')) return;
  await api('/api/competitions/' + id, { method: 'DELETE' });
  toast('已删除'); closeDrawer(); refresh();
}

/* ---------- 添加/编辑表单 ---------- */
async function openForm(id) {
  S.editingId = id || null;
  $('formTitle').textContent = id ? '✏️ 编辑比赛' : '＋ 添加比赛';
  const f = id ? (await api('/api/competitions/' + id)).competition : {};
  $('f_name').value = f.name || ''; $('f_deadline').value = f.deadline || '';
  $('f_suggested').value = f.suggested_deadline && f.suggested_deadline !== f.deadline ? f.suggested_deadline : '';
  $('f_buffer').value = f.deadline_buffer_days ?? ''; $('f_category').value = f.category || '';
  $('f_organizer').value = f.organizer || ''; $('f_website').value = f.website || '';
  $('f_signup_start').value = f.signup_start || ''; $('f_signup_end').value = f.signup_end || '';
  $('f_requirements').value = f.requirements || '';
  $('f_deliverables').value = (f.deliverables || []).join('\n');
  $('f_sub_method').value = f.submission?.method || ''; $('f_sub_target').value = f.submission?.target || '';
  $('f_sub_fee').value = f.submission?.fee || ''; $('f_sub_contact').value = f.submission?.contact || '';
  $('f_fmt_types').value = (f.format?.file_types || []).join(', '); $('f_fmt_size').value = f.format?.max_size_mb ?? '';
  $('f_fmt_naming').value = f.format?.naming || '';
  $('f_milestones').value = (f.milestones || []).map(m => `${m.name}:${m.date}`).join('\n');
  $('f_notes').value = f.notes || '';
  $('formModal').classList.remove('hidden');
}
function closeForm() { $('formModal').classList.add('hidden'); S.editingId = null; }
async function submitForm() {
  const name = $('f_name').value.trim(), deadline = $('f_deadline').value;
  if (!name || !deadline) return toast('名称和官方截止是必填项', 'warn');
  const suggested = $('f_suggested').value || null;
  if (suggested && suggested > deadline) return toast('临期线不能晚于官方截止', 'warn');
  const body = {
    name, deadline,
    suggested_deadline: suggested,
    deadline_buffer_days: $('f_buffer').value !== '' ? Number($('f_buffer').value) : null,
    category: $('f_category').value.trim(), organizer: $('f_organizer').value.trim(), website: $('f_website').value.trim(),
    signup_start: $('f_signup_start').value || null, signup_end: $('f_signup_end').value || null,
    requirements: $('f_requirements').value,
    deliverables: $('f_deliverables').value.split('\n').map(s => s.trim()).filter(Boolean),
    submission: {
      method: $('f_sub_method').value.trim(), target: $('f_sub_target').value.trim(),
      fee: $('f_sub_fee').value.trim(), contact: $('f_sub_contact').value.trim(),
    },
    format: {
      file_types: $('f_fmt_types').value.split(',').map(s => s.trim()).filter(Boolean),
      max_size_mb: $('f_fmt_size').value !== '' ? Number($('f_fmt_size').value) : null,
      naming: $('f_fmt_naming').value.trim(),
    },
    milestones: $('f_milestones').value.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const [n, ...rest] = l.split(':'); return { name: n.trim(), date: rest.join(':').trim() };
    }),
    notes: $('f_notes').value,
  };
  try {
    if (S.editingId) await api('/api/competitions/' + S.editingId, { method: 'PUT', body });
    else await api('/api/competitions', { method: 'POST', body });
    toast(S.editingId ? '已保存' : '已添加 🎉'); closeForm(); refresh();
  } catch (e) { toast('保存失败：' + e.message, 'err'); }
}

/* ---------- 筛选联动 / 初始化 ---------- */
function fillFilterOptions() {
  const cats = new Set((S.comps || []).map(c => c.category).filter(Boolean));
  $('catFilter').innerHTML = '<option value="">全部类别</option>' + [...cats].map(c => `<option ${S.filter.cats.includes(c) ? 'selected' : ''}>${esc(c)}</option>`).join('');
  const statuses = [['', '全部状态'], ['urgent', '🚨 即将截止'], ['past_suggested', '⚠️ 已过临期线'], ['submitting', '进行中'], ['open', '报名中'], ['not_started', '未开始'], ['overdue', '已截止'], ['submitted', '已提交'], ['done', '已完成'], ['abandoned', '已放弃']];
  $('statusFilter').innerHTML = statuses.map(([v, l]) => `<option value="${v}" ${S.filter.statuses.includes(v) && v ? 'selected' : ''}>${l}</option>`).join('');
  const dl = $('catList'); if (dl) dl.innerHTML = [...cats].map(c => `<option value="${esc(c)}">`).join('');
}
let searchDebounce = null;
$('searchBox').addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { S.filter.keyword = e.target.value; refresh(); }, 250);
});
/* 快捷键：Ctrl+K / Ctrl+F 聚焦搜索 */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' ||
      (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault();
    $('searchBox').focus(); $('searchBox').select();
  }
});
$('catFilter').addEventListener('change', e => { S.filter.cats = e.target.value ? [e.target.value] : []; refresh(); });
$('statusFilter').addEventListener('change', e => { S.filter.statuses = e.target.value ? [e.target.value] : []; refresh(); });
window.__onImport = () => { refresh(); toast('检测到新文件导入，已刷新'); };

(async function init() {
  S.dark = new URLSearchParams(location.search).get('dark') === '1'
    ? true : localStorage.getItem('ds_theme') === 'dark';
  document.documentElement.classList.toggle('dark', S.dark);
  const sun0 = $('themeSun'), moon0 = $('themeMoon');
  if (sun0 && moon0) { sun0.classList.toggle('hidden', !S.dark); moon0.classList.toggle('hidden', S.dark); }
  const initialView = (location.hash || '#overview').slice(1);
  if (['overview', 'list', 'timeline', 'charts', 'ai', 'awards', 'import', 'settings'].includes(initialView)) {
    S.view = initialView;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === initialView));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'view-' + initialView));
  }
  try {
    const h = await api('/api/health');
    S.port = h.port ?? (location.port || '');
    S.dataDir = h.data_dir || '';
  } catch (e) { S.port = location.port || ''; }
  try { S.importHistory = JSON.parse(localStorage.getItem('wc_import_history') || '[]') || []; } catch (e) { S.importHistory = []; }
  try { S.ai.messages = JSON.parse(localStorage.getItem('wc_ai_chat') || '[]') || []; } catch (e) {}
  await refresh();
  refreshAwards().catch(() => {});
  setInterval(() => { refresh().catch(() => {}); refreshAwards().catch(() => {}); }, 60000);  // 60s 静默刷新
})().catch(e => { console.error(e); window.alert('启动未完成：' + (e.message || e) + '\n请保留数据目录，勿卸载或清空数据。'); });
</script>
