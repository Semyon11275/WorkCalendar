name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==12.3.0 pywebview==6.2.1
      - run: python -c "import webview, clr_loader; assert callable(webview.create_window) and callable(webview.start)"
      - run: python -m unittest discover -s tests -t .
      - run: node tests/test_mobile.cjs
      - run: node tests/test_sync_frontend.cjs
      - run: node tests/test_release_frontend.cjs
      - run: npm ci
        working-directory: android-app
      - run: npm audit --audit-level=high
        working-directory: android-app
      - run: python scripts/sync_web.py
      - run: npm run sync
        working-directory: android-app
