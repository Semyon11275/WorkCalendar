name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -t .
      - run: node tests/test_mobile.cjs
      - run: npm ci
        working-directory: android-app
      - run: npm audit --audit-level=high
        working-directory: android-app
      - run: python scripts/sync_web.py
      - run: npm run sync
        working-directory: android-app
  publish:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the tested release packages
        working-directory: release-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified v0.5.0 packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            echo 'Release already exists; leaving published artifacts unchanged.'
            exit 0
          fi
          gh release create v0.5.0 --target "$GITHUB_SHA" --title '工作日历 v0.5.0' --notes-file RELEASE_NOTES.md --draft
          gh release upload v0.5.0 release-assets/WorkCalendar-Windows-x64-v0.5.0.zip release-assets/WorkCalendar-Android-v0.5.0.apk release-assets/WorkCalendar-Source-v0.5.0.zip release-assets/SHA256SUMS.txt release-assets/RELEASE_MANIFEST.json ACCEPTANCE.md
          gh release edit v0.5.0 --draft=false --latest
